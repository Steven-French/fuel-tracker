<style>
:root{
  --bg:#f4f5f8;--card:#fff;--card2:#f7f8fb;--text:#14161b;--muted:#6b7280;--line:#e5e7ee;
  /* nutrient colors: calories amber-orange, protein red, weight green. *-solid = button fills (white text ≥ 4.5:1) */
  --cal:#f08a00;--cal-soft:rgba(240,138,0,.14);--cal-over:#b45309;
  --pro:#1e40af;--pro-soft:rgba(30,64,175,.12);--pro-solid:#1e40af;--food-solid:#1877F2;   /* protein: deep blue (distinct from the #1877F2 + Food button and teal carbs) */
  --streak:#d62828;--streak-soft:rgba(214,40,40,.12);
  --wt:#15803d;--wt-soft:rgba(21,128,61,.13);--wt-solid:#15803d;
  /* general UI accent (links, primary buttons, active tab, focus) */
  --accent:#6d5dfc;--accent-soft:rgba(109,93,252,.14);
  --carb:#0e9aa7;--fat:#e9a800;--fib:#1fae6b;   /* carbs: teal (was sky blue) so it never reads like protein */
  --good:#16a34a;--bad:#e5484d;--warn:#f59e0b;
  --radius:18px;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --tabh:64px;
  /* safe-area insets (iPhone notch / home indicator in the standalone Home Screen app) */
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1015;--card:#171a21;--card2:#1e222b;--text:#eef0f4;--muted:#99a0ad;--line:#282c36;
  --cal:#ffb020;--cal-soft:rgba(255,176,32,.18);--cal-over:#f97316;
  --pro:#93b4ff;--pro-soft:rgba(147,180,255,.18);--carb:#2cc0d0;--streak:#ff5a5f;--streak-soft:rgba(255,90,95,.18);--wt:#34c77b;--wt-soft:rgba(52,199,123,.18);
  --accent:#8173ff;--accent-soft:rgba(129,115,255,.2);--shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{font-size:16px}
.hidden{display:none!important}
.app{max-width:600px;margin:0 auto;padding:calc(var(--sat) + 8px) 16px calc(var(--tabh) + var(--sab) + 90px)}
.topbar{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 2px 12px;gap:6px}
.topbar>div:first-child{min-width:0;max-width:100%}
#topRight:empty{display:none}
.topbar h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:750;white-space:nowrap}
.topbar h1.long{font-size:clamp(19px,7.2vw,28px);letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;margin-bottom:14px}
.datenav .arrow{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.datenav .arrow:active{background:var(--card2)}
.datenav .arrow:disabled{opacity:.25}
.tag.planned{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent)}
.tag.locked{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.ringbox.ro{cursor:default}
.plannote{text-align:center;font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.ringbox.off{cursor:default}.ringbox.off .ring,.ringbox.off .lbl{opacity:.55}
.fab:disabled{opacity:.4;filter:grayscale(.6);box-shadow:none;cursor:not-allowed}
.calover{color:var(--cal-over)}
.datelabel{text-align:center;position:relative;flex:1}
.datelabel b{display:block;font-size:16px}
.datelabel span{font-size:12px;color:var(--muted)}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--streak-soft);color:var(--streak);white-space:nowrap}
.hero{padding:16px 10px 14px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ringbox{text-align:center;min-width:0;display:block;width:100%;color:inherit;border-radius:14px}
button.ringbox{padding:0}
button.ringbox:active{background:var(--card2)}
.ringbox .lbl{font-size:11.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;white-space:nowrap}
.ring{position:relative;width:100%;max-width:150px;margin:0 auto;aspect-ratio:1}
.ring svg.spark{position:absolute;inset:0;transform:none}
.ring svg.spark circle{fill:var(--muted);fill-opacity:.45;stroke:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--card2)}
.ring .prog{stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:clamp(17px,5.4vw,26px);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.ring .big .u{font-size:.6em;font-weight:700;letter-spacing:0}
.ring .of{font-size:clamp(10px,2.9vw,11.5px);color:var(--muted);margin-top:3px;white-space:nowrap}
.ring .center.top{justify-content:flex-start;padding-top:27%}
.remain{margin-top:6px;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remain.sub{margin-top:1px;font-size:11px;font-weight:500;color:var(--muted)}
.remain .down{color:var(--good)}.remain .up{color:var(--bad)}
.remain.over{color:var(--cal-over)}
.remain.eaten{color:var(--muted);font-weight:600}
.ring .big.neg,.ring .of.neg{color:var(--bad)}.ring .of.neg{font-weight:650}
.remain.hit{color:var(--good)}
.ringbox[data-ring=pro] .big,.ringbox[data-ring=pro] .remain:not(.hit){color:var(--pro)}.ringbox[data-ring=pro] .of{color:var(--pro);opacity:.8}
.secondary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.macro .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.macro .mh b{color:var(--text);font-weight:650}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--text);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;width:100%;text-align:left}
.banner b{color:var(--accent)}
.meal{padding:12px 14px}
.meal-h{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
.meal-h h3{margin:0;font-size:16px;font-weight:700}
.meal-h .tot{font-size:12px;color:var(--muted)}
.addbtn{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px;color:var(--accent);font-weight:500}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.meal-h + .entry{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm span{font-size:12px;color:var(--muted)}
.entry .kc{text-align:right;font-size:14px;font-weight:650;white-space:nowrap}
.entry .kc span{display:block;font-size:12px;color:var(--pro);font-weight:650}
.empty{font-size:13px;color:var(--muted);padding:6px 0 4px}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}
.fabs{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab) + 14px);z-index:20;display:flex;justify-content:center;gap:10px;padding:0 12px;pointer-events:none}
.fab{pointer-events:auto;background:var(--food-solid);color:#fff;font-weight:700;padding:14px 20px;min-height:50px;border-radius:99px;box-shadow:0 8px 22px color-mix(in srgb,var(--food-solid) 40%,transparent);display:flex;gap:7px;align-items:center;justify-content:center;font-size:15px;white-space:nowrap}
.fab:active{transform:scale(.97)}
#fabW{background:var(--wt-solid);box-shadow:0 8px 22px color-mix(in srgb,var(--wt-solid) 40%,transparent)}
#fabX{background:#111;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.fab .pl{font-size:20px;line-height:1}.fab .sm{display:none}
@media (max-width:419px){.fab .lg{display:none}.fab .sm{display:inline}.fabs{gap:8px}}
@media (prefers-color-scheme:dark){#fabX{border:1px solid rgba(255,255,255,.4);box-shadow:none}}
@media (max-width:360px){.fab{padding:13px 14px;font-size:14px;gap:5px}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
/* 4 tabs, each an equal share of the full bar width (inside the left/right safe areas) */
.tabbar .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;height:100%;padding:0;margin:0;text-align:center;font-size:11px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none;transition:border-color .15s;min-height:44px}
.inp:focus{border-color:var(--accent)}
.inp.req{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.inp.err{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:650;background:var(--card2);min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:rgba(229,72,77,.12);color:var(--bad)}
.btn.block{width:100%}
.btn:active{opacity:.85}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{padding:7px 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden}
.stepper button{width:44px;height:44px;font-size:20px;color:var(--accent);font-weight:600}
.stepper input{flex:1;min-width:0;text-align:center;border:0;background:transparent;padding:10px 0;outline:none;font-weight:650}
.addrow{display:grid;grid-template-columns:minmax(118px,40%) minmax(0,1fr);gap:10px;align-items:end;margin:2px 0 10px}
.addrow .f{margin:0}
.addrow .btn{height:46px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.picked .srccard{margin-bottom:12px}
.preview{display:flex;gap:10px;flex-wrap:wrap;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.preview b{font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:600px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;padding:8px 16px 10px}
.sheet .sh h3{margin:0;font-size:18px;flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.sheet .sb{overflow-y:auto;padding:0 16px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sect + .food,.food:first-child{border-top:0}
.food .fb{flex:1;min-width:0;text-align:left}
.food .fb > b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .fb > span{font-size:12px;color:var(--muted)}
.qadd{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;display:grid;place-items:center;flex:none;transition:background .2s}
.qadd.done{background:var(--good)}
.trash{width:34px;height:34px;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.trash svg,.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .d{font-size:12px;color:var(--muted)}
.down{color:var(--good)}.up{color:var(--bad)}
.chart{width:100%;position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:10.5px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list .wrow{width:100%;text-align:left;min-height:52px}.wrow .chev{color:var(--muted);font-size:20px;margin-left:4px}
.list .li:first-child{border-top:0}
.dayrow{width:100%;text-align:left}
.ok{color:var(--good);font-weight:700}
.no{color:var(--muted)}
.big-streak{display:flex;align-items:center;gap:14px}
.streakcard .sk-top{display:flex;align-items:center;gap:16px}
.sk-ring{--pct:0%;width:92px;height:92px;flex:none;border-radius:50%;padding:7px;background:conic-gradient(from -90deg,#f08a00,#d62828 var(--pct),var(--card2) var(--pct))}
.sk-in{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sk-fl{font-size:18px}.sk-n{font-size:34px;font-weight:850;letter-spacing:-.04em;color:var(--text)}
.sk-h{font-size:18px;font-weight:750;display:block;margin-bottom:2px}
.sk-best{margin-top:8px;font-size:13px;font-weight:600;display:inline-block;background:var(--cal-soft);padding:4px 10px;border-radius:99px}
.sk-days{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:14px}
.sk-d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
.sk-d i{display:block;width:100%;max-width:18px;aspect-ratio:1;border-radius:50%;background:var(--card2)}
.sk-d.on i{background:linear-gradient(135deg,#f08a00,#d62828)}
.sk-d.today i{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--cal)}.sk-d.today span{color:var(--text);font-weight:700}
.sk-msg{margin-top:10px;font-size:13px;color:var(--muted)}
details.wlist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.wlist summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--accent);list-style:none}
details.wlist summary::-webkit-details-marker{display:none}
details.wlist summary::after{content:" ›";display:inline-block;transition:transform .2s}details.wlist[open] summary::after{transform:rotate(90deg)}
details.wlist summary small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.pavg{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pavg-n{font-size:36px;font-weight:850;letter-spacing:-.03em;line-height:1}.pavg-n small{font-size:15px;font-weight:700;margin-left:2px}
.mday{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.mday-h{display:flex;align-items:center;gap:4px;margin-bottom:4px}

  const X = d => pts.length===1 ? (x0+x1)/2 : x0 + (x1-x0)*(29-diffDays(d,k))/29, Y = v => y1 - (y1-y0)*(v-lo)/(hi-lo);
  const dots = pts.map(p=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="1.6"/>`).join('');
  const line = pts.length>1 ? `<polyline points="${pts.map(p=>X(p.date).toFixed(1)+','+Y(p.ma).toFixed(1)).join(' ')}" fill="none" stroke="var(--wt)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  return `<svg class="spark" viewBox="0 0 124 124" aria-hidden="true">${dots}${line}</svg>`;
}

  const ring = pr==null

  const sub = pr==null ? u : `goal ${fmtW(gw)}`;

function foodListHTML(){

    const foods = S.foods.filter(match).sort((a,b)=>a.name.localeCompare(b.name));

    return `<div class="sect">Saved</div>` + foods.map(f=>foodRow(f,'mine')).join('');
  }
  const rec = recentFoods().filter(match);
  if(!rec.length) return `<div class="empty" style="padding:18px 0;text-align:center">${q?'No matches.':'Foods you log will show up here for one-tap logging.'}<br><button class="linkbtn" data-act="stab" data-tab="new">Add a new food →</button></div>`;

function upsertFood(e){
  const key = e.name.trim().toLowerCase();

  const data = {name:e.name, cal:e.cal, p:e.p, c:e.c, f:e.f, fib:e.fib, servings:1, ...servOf(e), ...metaOf(e)};
  if(ex && !e.serv) delete ex.serv;

function barChartHTML(days, valFn, goal, opts){
  const W = Math.max(260, ($('#view').clientWidth||360) - 32), H = opts.h || 170, padL = 34, padB = 22, padT = 16;
  const vals = days.map(valFn);
  const raw = Math.max(goal*1.15, ...vals, 1);
  const step = [5,10,20,25,50,100,200,250,500,1000,2000].find(s=>raw/s<=4) || 5000;
  const max = Math.ceil(raw/step)*step;
  const y = v => padT + (H-padT-padB)*(1 - v/max);
  const n = days.length, slot = (W-padL)/n, bw = Math.min(22, slot*0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label)}">`;
  const ticks=[]; for(let t=0;t<=max+1e-9;t+=step) ticks.push(t);
  ticks.forEach(t=>{ s += `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(t)+3.5}" text-anchor="end">${t>=1000?(t/1000).toFixed(t%1000?1:0)+'k':Math.round(t)}</text>`; });
  days.forEach((k,i)=>{
    const v = vals[i], x = padL + slot*i + (slot-bw)/2, yy = y(v);
    s += `<g data-act="goto-day" data-k="${k}" style="cursor:pointer"><rect x="${padL+slot*i}" y="${padT}" width="${slot}" height="${H-padT-padB}" fill="transparent"/>`;
    if(v>0) s += `<rect class="bar-v" x="${x}" y="${yy}" width="${bw}" height="${Math.max(2,H-padB-yy)}" rx="${Math.min(5,bw/3)}" fill="${opts.color(opts.hit(k))}"/>`;
    else s += `<rect x="${x}" y="${H-padB-2}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`;
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" ${k===todayKey()?'style="fill:var(--text);font-weight:700"':''}>${parseKey(k).getDate()}</text></g>`;
  });
  s += `<line x1="${padL}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="${opts.goalColor}" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W}" y="${y(goal)-5}" text-anchor="end" style="fill:${opts.goalColor};font-weight:700">Goal ${fmtN(goal)}${opts.suffix||''}</text></svg>`;
  return s;
}

class HttpError extends Error { constructor(status, code){ super('HTTP '+status); this.status = status; this.code = code; } }

async function fetchJSON(url, {timeout=12000, signal}={}){
  const ctrl = new AbortController();

  const onAbort = ()=>ctrl.abort();
  if(signal){ if(signal.aborted) ctrl.abort(); else signal.addEventListener('abort', onAbort, {once:true}); }
  try{
    const res = await fetch(url, {signal: ctrl.signal, credentials:'omit'});
    let body = null; try { body = await res.json(); } catch(e){}
    if(!res.ok) throw new HttpError(res.status, body && body.error && body.error.code);

    if(signal && signal.aborted) x.cancelled = true; else if(ctrl.signal.aborted) x.timeout = true; else x.network = true;

/* --- normalizers: every food becomes {per100:{cal,p,c,f,fib}, basis:'g'|'ml', portions:[{label, grams, exact?}]} --- */
const titleIfCaps = s => { s = String(s||'').trim(); return (s && s===s.toUpperCase() && /[A-Z]/.test(s)) ? s.toLowerCase().replace(/(^|[\s(\-\/&,.])([a-z])/g,(m,a,b)=>a+b.toUpperCase()) : s; };

  const unitRaw = String(f.servingSizeUnit||'g').toLowerCase();

  const portions = [], seen = new Set();

  if(f.dataType==='Branded' && +f.servingSize>0 && /^(g|grm|gram|ml|mlt|milliliter)/.test(unitRaw)){
    const ss = +f.servingSize, hh = String(f.householdServingFullText||'').trim().toLowerCase();
    const p = {label:`${hh||'1 serving'} (${r1(ss)} ${basis})`, grams:ss};

    dataType:f.dataType||'USDA', basis, per100, portions:portions.slice(0,12), barcode:String(f.gtinUpc||''),

}
function fromOFF(p){

  let cal = v('energy-kcal_100g');
  if(cal==null){ const kj = v('energy-kj_100g') ?? v('energy_100g'); if(kj!=null) cal = kj/4.184; } // energy_100g is kJ
  const pr = v('proteins_100g'), cb = v('carbohydrates_100g'), ft = v('fat_100g');

  const portions = [];

  brand = String(brand||'').trim(); if(brand && brand===brand.toLowerCase()) brand = brand.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());

/* --- searching --- */
async function searchUSDA(q, signal){
  const key = usdaKey();
  // DEMO_KEY is heavily rate-limited, so only generic foods are queried with it (Open Food Facts covers brands).
  const reqs = [{types:USDA_GENERIC, size:20}];
  if(key!=='DEMO_KEY') reqs.push({types:['Branded'], size:15});
  const get = (types, size) => fetchJSON(`${USDA_SEARCH}?api_key=${uenc(key)}&query=${uenc(q)}&pageSize=${size}&dataType=${uenc(types.join(','))}`, {signal});
  // USDA's front end intermittently answers HTTP 400 to requests that include "Survey (FNDDS)" (~1 in 3; the same URL works on retry):
  // retry once, then fall back to Foundation + SR Legacy so generic foods still show up.
  const aborted = () => !!(signal && signal.aborted), flaky = (e, types) => e && e.status===400 && types.includes('Survey (FNDDS)') && !aborted();
  const getRetry = async (types, size) => {
    try { return await get(types, size); } catch(e){ if(!flaky(e, types)) throw e; }
    try { return await get(types, size); } catch(e){ if(!flaky(e, types)) throw e; }
    return get(types.filter(t=>t!=='Survey (FNDDS)'), size);
  };
  const settled = await Promise.allSettled(reqs.map(r=>getRetry(r.types, r.size)));
  const ok = settled.filter(s=>s.status==='fulfilled');
  if(!ok.length) throw settled[0].reason;
  return ok.flatMap(s=>(s.value && s.value.foods)||[]).map(fromUSDA).filter(Boolean);
}
async function searchOFF(q, signal){
  let last;
  for(let i=0;i<OFF_SEARCH_HOSTS.length;i++){
    if(i) await sleep(700);
    if(signal && signal.aborted){ const x = new Error('cancelled'); x.cancelled = true; throw x; }
    try{
      const d = await fetchJSON(`${OFF_SEARCH_HOSTS[i]}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`, {signal, timeout:10000});
      return ((d && d.products)||[]).map(fromOFF).filter(Boolean);
    } catch(e){ if(e.cancelled) throw e; last = e; if(e.status && e.status<500 && e.status!==429) break; }
  }
  throw last;
}
const normTxt = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function rankMerge(q, lists){
  const toks = normTxt(q).split(' ').filter(Boolean);
  const seen = new Set(), out = [];
  lists.flat().forEach((f,idx)=>{
    const bc = f.barcode.replace(/\D/g,'').replace(/^0+/,'');
    const kName = 'n:'+normTxt(f.brand+' '+f.name)+'|'+Math.round(f.per100.cal/5);
    if((bc && seen.has('b:'+bc)) || seen.has(kName)) return; // de-duplicate across sources (same barcode, or same brand+name+energy)
    if(bc) seen.add('b:'+bc); seen.add(kName);
    const name = normTxt(f.name), words = name.split(' ');
    let s = toks.length ? toks.filter(t=>words.some(w=>w.startsWith(t))).length/toks.length : 0;
    if(toks[0] && name.startsWith(toks[0])) s += .15;
    s += ({'Foundation':.35,'SR Legacy':.3,'Survey (FNDDS)':.3}[f.dataType]||0);
    s -= Math.min(.25, name.length/400);
    if(f.us) s += .12; // Steven is in the US: prefer products sold there
    out.push({f, s, idx});
  });
  return out.sort((a,b)=>b.s-a.s || a.idx-b.idx).map(x=>x.f);

// UPC-A (12) and EAN-13 (13, leading 0) are the same number; UPC-E (8) is a compressed UPC-A. Try every spelling.
function upcCheck(d11){ let s = 0; for(let i=0;i<11;i++) s += (+d11[i]) * (i%2===0 ? 3 : 1); return String((10 - s%10) % 10); }
function upcEtoA(e){
  if(!/^[01]\d{7}$/.test(e)) return null;
  const s = e[0], d = e.slice(1,7), c = e[7], l = d[5];
  const m = l<='2' ? d[0]+d[1]+l+'0000'+d[2]+d[3]+d[4]
    : l==='3' ? d[0]+d[1]+d[2]+'00000'+d[3]+d[4]
    : l==='4' ? d[0]+d[1]+d[2]+d[3]+'00000'+d[4]
    : d.slice(0,5)+'0000'+l;

function barcodeCandidates(raw, format){
  let d = String(raw||'').replace(/\D/g,'');

  const out = [], add = x => { if(x && !out.includes(x)) out.push(x); };
  if(d.length===14 && d[0]==='0') d = d.slice(1); // GTIN-14 with a leading 0
  if(d.length===12){ add('0'+d); add(d); }
  else if(d.length===13){ add(d); if(d[0]==='0') add(d.slice(1)); }
  else if(d.length===8){

    else { add(d); if(a && fmt!=='EAN8'){ add('0'+a); add(a); } }
  }
  else add(d);
  return out;
}

async function barcodeLookup(raw, format){

  const code = String(raw||'').replace(/\D/g,'');

  if(dbCtrl) dbCtrl.abort();

  if(!navigator.onLine){ st.db.status='offline'; paintDb(); return; }

  const cands = barcodeCandidates(code, format);
  let food = null, err = null, noNutrition = null;
  for(const c of cands){
    try{

function usdaErrMsg(e){

  if(e.status===401 || e.status===403) return 'USDA search is unavailable right now (the key was refused). Open Food Facts results still work.';
  if(e.timeout) return 'USDA: the request timed out.';
  if(e.network) return 'USDA: couldn’t connect.';
  return `USDA: error (HTTP ${e.status}).`;
}
function offErrMsg(e){
  if(e.timeout) return 'Open Food Facts: the request timed out.';
  if(e.status===429) return 'Open Food Facts: too many searches — wait a minute and try again.';
  if(e.network || e.status>=500) return 'Open Food Facts search is busy or unreachable right now — try again in a moment. Barcode lookup usually still works.';
  return `Open Food Facts: error (HTTP ${e.status}).`;

const srcLabelOf = f => f.src==='usda' ? `USDA FoodData Central · ${typeLabel(f)||'USDA'}` : 'Open Food Facts';

const NUT_SECTIONS = [
  ['general','General','var(--cal)', [['cal','Energy','kcal'],'alcohol','caffeine','water']],
  ['carbs','Carbohydrates','var(--carb)', [['c','Carbs','g'],['fib','Fiber','g',1],'starch','sugar','addedSugar',['net','Net carbs','g',1]]],
  ['lipids','Lipids','var(--fat)', [['f','Fat','g'],'satFat','monoFat','polyFat','transFat','chol','omega3','omega6']],
  ['protein','Protein','var(--pro)', [['p','Protein','g'],'cys','his','ile','leu','lys','met','phe','thr','trp','tyr','val']],
  ['vit','Vitamins','var(--accent)', ['b1','b2','b3','b5','b6','b7','b12','folate','choline','vitA','vitC','vitD','vitE','vitK']],
  ['min','Minerals','var(--fib)', ['ca','cr','cu','fl','iod','fe','mg','mn','mo','phos','k','se','na','zn']]
].map(([id,title,color,rows])=>({id, title, color, rows:rows.map(r=>typeof r==='string' ? {key:r, label:NUT[r].label, unit:NUT[r].unit, sub:NUT[r].sec!=='vit'&&NUT[r].sec!=='min'&&!['alcohol','caffeine','water'].includes(r)} : {key:r[0], label:r[1], unit:r[2], sub:!!r[3]})}));
/* values for a set of entries-like records {cal,p,c,f,fib,nut,servings}: macros always, nutrients only where some record has them */
function nutValues(recs){
  const v = {cal:0,p:0,c:0,f:0,fib:0}, seen = {};
  for(const e of recs){ const s = e.servings||1; v.cal += nz(e.cal)*s; v.p += nz(e.p)*s; v.c += nz(e.c)*s; v.f += nz(e.f)*s; v.fib += nz(e.fib)*s;
    if(e.nut) for(const k of Object.keys(e.nut)){ v[k] = (v[k]||0) + e.nut[k]*s; seen[k] = (seen[k]||0)+1; } }
  v.net = Math.max(0, v.c - v.fib);
  return {v, seen};
}
function fmtAmt(x){ if(x===0) return '0'; if(x<0.01) return '<0.01'; if(x<1) return String(Math.round(x*100)/100); if(x<100) return String(r1(x)); return fmtN(x); }

/* status of a value against its target: under / met / over (above the UL or a limit) / ok (under a limit) / none */
function nutStatus(x, t){
  if(x==null || !t) return {st:'none', pct:null};
  if(t.goal>0){ const pct = x/t.goal*100; return {st: t.ul && x>t.ul ? 'over' : pct>=99.5 ? 'met' : 'under', pct}; }
  if(t.ul>0){ const pct = x/t.ul*100; return {st: x>t.ul ? 'over' : 'ok', pct}; }
  return {st:'none', pct:null};
}

      : limited.length ? `<details class="small nnote" id="nutNote"><summary><b>${limited.length} of ${list.length} food${list.length===1?'':'s'}</b> ${limited.length===1?'has':'have'} limited or no micronutrient data, so vitamin and mineral totals may read low.</summary>
        <ul>${limited.map(e=>`<li>${esc(e.name)} <span class="muted">· ${!e.nut?'no nutrient data (entered manually or logged before full tracking)':`${microCount(e.nut)} vitamins/minerals listed`}</span></li>`).join('')}</ul></details>`
      : `<p class="muted small" id="nutNote" style="margin:10px 0 0">All ${list.length} food${list.length===1?'':'s'} have full micronutrient data.</p>`}
    <div class="legend small"><span class="st-under"><i></i>Under target</span><span class="st-met"><i></i>Met</span><span class="st-over"><i></i>Over limit</span></div>
  </section>`;
  for(const sec of NUT_SECTIONS){
    html += `<section class="card nsecT" id="nsec-${sec.id}"><h3>${sec.title}</h3>`;
    for(const r of sec.rows) html += tabRowHTML(r, r.key in v ? v[r.key] : null, T[r.key], sec.color);
    html += `</section>`;
  }
  const kg = latestKg(), adult = tg.basis==='dri' && tg.age>=19;
  html += `<p class="muted small ntarget" id="nutTargets">Targets: ${tg.basis==='dri' ? esc(tg.label) : `${esc(tg.label)} (label values). <button class="linkbtn" data-act="tab" data-tab="goals">Set sex and age in Goals</button> for personal NIH DRIs`}.
    Calories, protein${G().carbs?', carbs':''}${G().fat?', fat':''}${G().fiber?', fiber':''} from your Goals${S.settings.eatBack!==false && burnedOn(k) ? ' (calories include exercise)' : ''}.
    ${tg.basis==='dri' ? `Sodium max is the CDRR; other maxes are ULs. Saturated fat and added sugars: under 10% of calories (Dietary Guidelines).${adult ? kg ? ' Amino acids: RDA per kg of your latest weight.' : ' Log a weight to get amino acid targets.' : ''}` : ''}</p>`;
  $('#view').innerHTML = html;
}

/* --- camera barcode scanning ---
   Native BarcodeDetector when the browser has it (Chrome on Android/macOS); otherwise the bundled ZXing decoder
   (vendor/zxing, WebAssembly) — that's the path iPhone Safari and the iOS Home Screen app use. The decoder is only
   loaded the first time the scan button is tapped, and the service worker caches it for offline use. */
const SCAN_FORMATS = ['ean_13','ean_8','upc_a','upc_e'];
const ZX_FORMATS = ['EAN13','EAN8','UPCA','UPCE'];
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let scanStop = null, zxingP = null;
function loadZXing(){
  if(zxingP) return zxingP;
  zxingP = new Promise((res, rej)=>{
    if(window.ZXingWASM) return res(window.ZXingWASM);
    const s = document.createElement('script'); s.src = 'vendor/zxing/zxing-reader.js'; s.async = true; s.id = 'zxingScript';
    s.onload = ()=> window.ZXingWASM ? res(window.ZXingWASM) : rej(new Error('scanner failed to initialise'));
    s.onerror = ()=>{ s.remove(); rej(new Error('scanner failed to load')); };
    document.head.appendChild(s);
  }).then(Z => Promise.race([
    Z.prepareZXingModule({overrides:{locateFile:(p, prefix)=> p.endsWith('.wasm') ? new URL('vendor/zxing/zxing_reader.wasm', document.baseURI).href : prefix+p}, fireImmediately:true}),
    new Promise((_, rej)=>setTimeout(()=>rej(new Error('scanner load timed out')), 30000))
  ]).then(()=>Z));
  zxingP.catch(()=>{ zxingP = null; }); // allow a retry on the next tap
  return zxingP;
}
async function nativeDetector(){
  if(!('BarcodeDetector' in window)) return null;
  try{
    const sup = await BarcodeDetector.getSupportedFormats();
    const formats = SCAN_FORMATS.filter(x=>sup.includes(x));
    return formats.length ? new BarcodeDetector({formats}) : null;
  } catch(e){ return null; }
}
async function openCamera(){
  const md = navigator.mediaDevices;
  try{ return await md.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}}); }
  catch(e){
    if(e && (e.name==='OverconstrainedError' || e.name==='ConstraintNotSatisfiedError')) return md.getUserMedia({audio:false, video:{facingMode:'environment'}});
    throw e;
  }
}
// Copy the part of the video under the aiming box (with some margin) to a canvas; every few frames use the whole frame.
function grabFrame(video, aim, canvas, ctx, full){
  const vw = video.videoWidth, vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if(!full && aim){
    const vr = video.getBoundingClientRect(), ar = aim.getBoundingClientRect();
    const scale = Math.max(vr.width/vw, vr.height/vh); // object-fit: cover
    const ox = (vr.width - vw*scale)/2, oy = (vr.height - vh*scale)/2;
    const mx = ar.width*0.15, my = ar.height*0.4;
    sx = Math.max(0, (ar.left - mx - vr.left - ox)/scale); sy = Math.max(0, (ar.top - my - vr.top - oy)/scale);
    sw = Math.min(vw - sx, (ar.width + 2*mx)/scale); sh = Math.min(vh - sy, (ar.height + 2*my)/scale);
    if(!(sw>40 && sh>40)){ sx = 0; sy = 0; sw = vw; sh = vh; }
  }
  const k = Math.min(1, 1280/sw), cw = Math.max(1, Math.round(sw*k)), ch = Math.max(1, Math.round(sh*k));
  if(canvas.width!==cw) canvas.width = cw;
  if(canvas.height!==ch) canvas.height = ch;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
  return ctx.getImageData(0, 0, cw, ch);
}
function setupTorch(track, btn){
  let caps = {};
  try{ caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e){}
  if(!caps || !caps.torch) return false;
  let on = false; btn.hidden = false;
  btn.onclick = async ()=>{
    try{ await track.applyConstraints({advanced:[{torch:!on}]}); on = !on; btn.setAttribute('aria-pressed', String(on)); btn.querySelector('span').textContent = on ? 'Light on' : 'Light'; }
    catch(e){ toast('Couldn’t switch the flashlight on'); }
  };
  return true;
}
function cameraError(e){
  const n = e && e.name;
  const kind = (n==='NotAllowedError' || n==='SecurityError' || n==='PermissionDeniedError') ? 'denied'
    : (n==='NotFoundError' || n==='DevicesNotFoundError' || n==='OverconstrainedError') ? 'nocam'
    : (n==='NotReadableError' || n==='TrackStartError' || n==='AbortError') ? 'busy' : 'other';
  const st = UI.sheet;
  if(!st){ toast('Couldn’t open the camera'); return; }
  if(dbCtrl) dbCtrl.abort();
  if(st.tab!=='search'){ st.tab = 'search'; renderSheet(); }
  st.db.status = 'cam-error'; st.db.camErr = kind; paintDb();
}
function camErrHTML(kind){
  const manual = `You can still type the barcode number in the field above and tap <b>Look up</b>, or <button class="linkbtn" data-act="stab" data-tab="new">enter the food manually</button>.`;
  if(kind==='denied') return `<div class="notice" data-err="camera"><b>NDLZ isn’t allowed to use the camera.</b> To scan barcodes on iPhone:
    <ol class="steps"><li>Open the <b>Settings</b> app → <b>Safari</b> → <b>Camera</b>, and choose <b>Ask</b> or <b>Allow</b>.</li>
    <li>Or in Safari, tap <b>aA</b> in the address bar → <b>Website Settings</b> → <b>Camera</b> → <b>Allow</b>.</li>
    <li>Come back and tap the scan button again. (Using NDLZ from your Home Screen? The same Safari camera setting applies — close and reopen NDLZ after changing it.)</li></ol>
    ${IS_IOS?'':'On other devices, allow the camera for this site in your browser’s site settings. '}${manual}</div>`;
  if(kind==='nocam') return `<div class="notice" data-err="camera"><b>No camera was found</b> on this device. ${manual}</div>`;
  if(kind==='busy') return `<div class="notice" data-err="camera"><b>The camera is busy</b> — another app or tab may be using it. Close it and try again. ${manual}</div>`;
  return `<div class="notice" data-err="camera"><b>Couldn’t start the camera.</b> ${manual}</div>`;
}
async function startScan(){
  if(scanStop) return;
  if(!CAN_SCAN){ toast('Camera scanning needs https. Type the barcode instead.'); return; }
  const ov = document.createElement('div'); ov.className = 'scanner'; ov.id = 'scanner';
  ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Scan a barcode');
  ov.innerHTML = `<video playsinline webkit-playsinline muted autoplay disablepictureinpicture></video>
    <div class="scanmid"><div class="aim"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><span class="laser"></span></div>
      <div class="status" aria-live="polite">Starting camera…</div></div>
    <div class="sbar"><button class="sbtn" data-act="scan-cancel" aria-label="Cancel scanning">${ICON.close}<span>Cancel</span></button>
      <button class="sbtn torch" hidden aria-pressed="false" aria-label="Flashlight"><svg viewBox="0 0 24 24"><path d="M8 2h8l-1 6H9zM9 8h6v3l-1.5 2V22h-3v-9L9 11z"/></svg><span>Light</span></button></div>
    <div class="sbottom"><button class="sbtn" data-scan="type">Type barcode instead</button></div>`;
  document.body.appendChild(ov);
  const video = ov.querySelector('video'), aim = ov.querySelector('.aim'), status = ov.querySelector('.status');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  let stopped = false, stream = null, timer = 0;
  const onVis = ()=>{ if(document.hidden) stop(); };
  const stop = ()=>{
    if(stopped) return; stopped = true; clearTimeout(timer);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    try{ video.pause(); video.srcObject = null; } catch(e){}
    ov.remove(); document.removeEventListener('visibilitychange', onVis);
    if(scanStop===stop) scanStop = null;
  };
  scanStop = stop; document.addEventListener('visibilitychange', onVis);
  ov.querySelector('[data-scan=type]').onclick = ()=>{ stop(); const bi = $('#barcodeInp'); if(bi){ bi.focus(); bi.scrollIntoView({block:'center'}); } };
  // Start the camera right away (inside the tap), and load the decoder in parallel.
  const camP = openCamera();
  const engP = nativeDetector().then(d => d ? {engine:'native', det:d} : loadZXing().then(Z=>({engine:'zxing', Z})));
  engP.catch(()=>{});
  try{ stream = await camP; }
  catch(e){ stop(); cameraError(e); return; }
  if(stopped){ stream.getTracks().forEach(t=>t.stop()); return; }
  video.srcObject = stream;
  try{ await video.play(); } catch(e){}
  const track = stream.getVideoTracks()[0], torchBtn = ov.querySelector('.torch');
  if(track && !setupTorch(track, torchBtn)) setTimeout(()=>{ if(!stopped) setupTorch(track, torchBtn); }, 700); // some devices report torch only once frames flow
  status.textContent = 'Loading scanner…';
  let eng;
  try{ eng = await engP; }
  catch(e){ if(stopped) return; stop(); toast('Couldn’t load the barcode scanner. Type the barcode instead.'); const bi = $('#barcodeInp'); if(bi) bi.focus(); return; }
  if(stopped) return;
  ov.dataset.engine = eng.engine;
  status.textContent = 'Line up the barcode inside the box';
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  let n = 0;
  const tick = async ()=>{
    if(stopped) return;
    let hit = null;
    try{
      if(video.readyState>=2 && video.videoWidth){
        if(eng.engine==='native'){
          const r = await eng.det.detect(video);
          const b = r.find(x=>/^\d{6,14}$/.test(String(x.rawValue||'')));
          if(b) hit = {text:String(b.rawValue), format:b.format};
        } else {
          const img = grabFrame(video, aim, canvas, ctx, (n++ % 3)===2);
          const r = await eng.Z.readBarcodes(img, {formats:ZX_FORMATS, tryHarder:true, maxNumberOfSymbols:1});
          const b = r.find(x=>x.isValid && /^\d{6,14}$/.test(x.text));
          if(b) hit = {text:b.text, format:b.format};
        }
      }
    } catch(e){}
    if(stopped) return;
    if(hit){
      stop();
      window.dispatchEvent(new CustomEvent('fuel:scan', {detail:{text:hit.text, format:hit.format, engine:eng.engine}}));
      if(navigator.vibrate) navigator.vibrate(60);
      const bi = $('#barcodeInp'); if(bi) bi.value = hit.text;
      barcodeLookup(hit.text, hit.format);
      return;
    }
    timer = setTimeout(tick, eng.engine==='native' ? 150 : 80);
  };
  tick();
}

/* ---------- Weight chart (Progress tab) ---------- */
function drawWeightChart(){
  const el = $('#wChart'); if(!el) return;
  const all = withMA(S.weights);
  if(!all.length){ el.innerHTML = `<div class="empty" style="padding:40px 0;text-align:center">Your weight trend will appear here.</div>`; return; }
  const lastDate = all[all.length-1].date;
  const span = {'1m':30,'3m':91,'1y':365,'all':1e6}[UI.wRange];
  const data = all.filter(p=>diffDays(p.date,lastDate) < span);
  const W = Math.max(260, el.clientWidth||320), H = 210, padL = 38, padR = 10, padT = 12, padB = 24;
  const x0 = data[0].date, xSpan = Math.max(1, diffDays(x0,lastDate));
  const vals = data.flatMap(p=>[toDisp(p.kg),toDisp(p.ma)]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const rng = Math.max(hi-lo, unit()==='lb'?2:1); const mid=(hi+lo)/2; lo = mid-rng*0.62; hi = mid+rng*0.62;
  const X = k => data.length===1 ? padL+(W-padL-padR)/2 : padL + (W-padL-padR)*diffDays(x0,k)/xSpan;
  const Y = v => padT + (H-padT-padB)*(1-(v-lo)/(hi-lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Weight chart with 7-day moving average">`;
  for(let i=0;i<=3;i++){ const v = lo+(hi-lo)*i/3; s += `<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL-6}" y="${Y(v)+3.5}" text-anchor="end">${v.toFixed(rng<6?1:0)}</text>`; }
  const lbls = data.length===1 ? [data[0].date] : [x0, addDays(x0, Math.round(xSpan/2)), lastDate];
  lbls.forEach((k,i)=>{ s += `<text x="${X(k)}" y="${H-6}" text-anchor="${data.length===1?'middle':['start','middle','end'][i]}">${esc(fmtDate(k,{month:'short',day:'numeric'}))}</text>`; });
  if(data.length>1){
    s += `<polyline points="${data.map(p=>X(p.date).toFixed(1)+','+Y(toDisp(p.kg)).toFixed(1)).join(' ')}" fill="none" stroke="var(--muted)" stroke-opacity=".3" stroke-width="1.2"/>`;
    const area = `M${X(data[0].date).toFixed(1)},${H-padB} `+data.map(p=>`L${X(p.date).toFixed(1)},${Y(toDisp(p.ma)).toFixed(1)}`).join(' ')+` L${X(lastDate).toFixed(1)},${H-padB} Z`;
    s += `<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wt)" stop-opacity=".22"/><stop offset="1" stop-color="var(--wt)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#wg)"/>`;
    s += `<polyline id="maLine" points="${data.map(p=>X(p.date).toFixed(1)+','+Y(toDisp(p.ma)).toFixed(1)).join(' ')}" fill="none" stroke="var(--wt)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const dotR = data.length>60?1.8:3;
  data.forEach(p=>{ s += `<circle class="wdot" cx="${X(p.date).toFixed(1)}" cy="${Y(toDisp(p.kg)).toFixed(1)}" r="${dotR}" fill="var(--card)" stroke="var(--muted)" stroke-width="1.4"/>`; });
  s += `<g id="wTip" style="display:none;pointer-events:none"><line id="wTipLine" y1="${padT}" y2="${H-padB}" stroke="var(--wt)" stroke-dasharray="3 3"/><circle id="wTipDot" r="5" fill="var(--wt)" stroke="var(--card)" stroke-width="2"/>
    <rect id="wTipBox" rx="8" height="36" width="136" fill="var(--text)"/><text id="wTipT1" style="fill:var(--card);font-weight:700;font-size:12px"></text><text id="wTipT2" style="fill:var(--card);opacity:.75;font-size:10.5px"></text></g>`;
  s += `<rect x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg');
  const show = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width);
    let best = data[0], bd = Infinity; data.forEach(p=>{ const d = Math.abs(X(p.date)-px); if(d<bd){ bd=d; best=p; } });
    const cx = X(best.date), cy = Y(toDisp(best.kg));
    $('#wTip',svg).style.display='';
    $('#wTipLine',svg).setAttribute('x1',cx); $('#wTipLine',svg).setAttribute('x2',cx);
    $('#wTipDot',svg).setAttribute('cx',cx); $('#wTipDot',svg).setAttribute('cy',cy);
    const bx = Math.min(Math.max(cx-68,padL), W-padR-136), by = cy < padT+50 ? H-padB-44 : padT;
    $('#wTipBox',svg).setAttribute('x',bx); $('#wTipBox',svg).setAttribute('y',by);
    const t1 = $('#wTipT1',svg), t2 = $('#wTipT2',svg);
    t1.setAttribute('x',bx+9); t1.setAttribute('y',by+15); t1.textContent = `${fmtW(best.kg)} ${unit()} · avg ${fmtW(best.ma)}`;
    t2.setAttribute('x',bx+9); t2.setAttribute('y',by+29); t2.textContent = fmtDate(best.date,{weekday:'short',month:'short',day:'numeric'});
  };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', ()=>{ $('#wTip',svg).style.display='none'; });
}

    trackChanges();                            // queue system migrations of pulled rows (old snack entries → a meal)
    await push(session.user.id);
    const m = loadMeta(); m.last = Date.now(); saveMeta(m);
    setSync('ok');
    if(changed) onRemoteChange();
  } catch(e){ setSync(netErr(e) ? 'offline' : 'error', (e && e.message) || String(e)); }
}
/* Server data reset (admin "start over" for one account; migration 20261008000000_data_reset.sql). meta.reset is the
   marker this device last applied: missing = never (devices from before this feature), 'join' = just signed in here
   (record the current marker; this device's data is merged as usual), else an ISO time. A newer server marker wipes this
   account's local data (entries, weigh-ins, exercise, My foods, goals, helper) and re-pulls everything from the server.
   Returns true when it wiped. A server without the column (older schema) is simply ignored. */
async function checkReset(userId){
  const {data, error} = await ACC.client.from('profiles').select('data_reset_at').eq('user_id', userId).maybeSingle();
  if(error){ if(error.code==='42703' || /data_reset_at/.test(error.message||'')) return false; throw error; }
  const srv = data && data.data_reset_at || null, m = loadMeta();
  if(m.uid!==userId) return false;
  if(m.reset==='join'){ m.reset = srv; saveMeta(m); return false; }
  const loc = typeof m.reset==='string' ? Date.parse(m.reset)||0 : 0;
  if(!srv || !(Date.parse(srv) > loc)) return false;
  if(UI.sheet && UI.sheet.mode!=='auth') closeSheet();
  S = defaults(); writeLocal();
  const n = blankMeta(); n.uid = m.uid; n.user = m.user; n.reset = srv; saveMeta(n);   // forget every record + cursor: full re-pull
  trackChanges();
  const n2 = loadMeta(); if(n2.recs.p.me) n2.recs.p.me[1] = 0; saveMeta(n2);            // the account's profile on the server wins
  UI.date = todayKey();
  toast('This account’s data was reset · starting fresh');
  return true;
}
async function pull(k, userId){
  let m = loadMeta();
  const since = m.cur[k] ? new Date(Date.parse(m.cur[k]) - 60000).toISOString() : null;  // 60 s overlap: never miss a row committed late
  let from = 0, last = null, changed = false;
  for(;;){
    let q = ACC.client.from(TABLE[k]).select('*').eq('user_id', userId);
    if(since) q = q.gte('synced_at', since);
    q = q.order('synced_at', {ascending:true}); if(k!=='p') q = q.order('id', {ascending:true});
    const {data, error} = await q.range(from, from+999); if(error) throw error;
    if(data.length){ if(applyRemote(k, data)) changed = true; last = data[data.length-1].synced_at; }
    if(data.length < 1000) break; from += 1000;
  }
  if(last){ m = loadMeta(); if(!m.cur[k] || Date.parse(last) >= Date.parse(m.cur[k])) m.cur[k] = last; saveMeta(m); }
  return changed;
}
async function push(userId){
  let m = loadMeta();
  const E = new Map(); for(const d in S.entries) for(const e of S.entries[d]) E.set(e.id, [d,e]);
  const X = new Map(); for(const d in S.exercise) for(const x of S.exercise[d]) X.set(x.id, [d,x]);
  const F = new Map(S.foods.map(f=>[f.id,f])), W = new Map(S.weights.map(w=>[weightId(w.date), w]));
  for(const k of KINDS){
    const ids = Object.keys(m.dirty[k]); if(!ids.length) continue;
    const rows = [], sent = [];
    for(const id of ids){
      const R = m.recs[k][id]; let data = null;
      if(R){ if(k==='p') data = rowP(); else if(R[0]===null) data = {deleted:true, ...NULLS[k]};
        else { const x = k==='e' ? E.get(id) : k==='x' ? X.get(id) : k==='f' ? F.get(id) : W.get(id); const r = x && (k==='e' ? rowE(x[0], x[1]) : k==='x' ? rowX(x[0], x[1]) : k==='f' ? rowF(x) : rowW(x)); if(r) data = {deleted:false, ...r}; } }
      if(!data){ delete m.dirty[k][id]; continue; }                       // nothing sendable (stale marker or invalid date)
      const row = {user_id:userId, updated_at:new Date(R[1]).toISOString(), ...data}; if(k!=='p') row.id = id;
      rows.push(row); sent.push([id, R[1], R[0]===null]);
    }
    saveMeta(m);
    const rejected = await upsertRows(k, rows);
    m = loadMeta();
    for(const [id, t, del] of sent){ const R = m.recs[k][id]; if(R && R[1]===t){ delete m.dirty[k][id]; if(del) delete m.recs[k][id]; } }
    m.rejected = (m.rejected||0) + rejected;
    saveMeta(m);
  }
}
async function upsertRows(k, rows){
  const onConflict = k==='p' ? 'user_id' : 'user_id,id', dataErr = e => /^(22|23)/.test((e && e.code)||''); let rejected = 0;
  for(let i=0; i<rows.length; i+=500){
    const chunk = rows.slice(i, i+500);
    const {error} = await ACC.client.from(TABLE[k]).upsert(chunk, {onConflict});
    if(!error) continue;
    if(!dataErr(error)) throw error;
    for(const r of chunk){ const x = await ACC.client.from(TABLE[k]).upsert(r, {onConflict}); if(x.error){ if(dataErr(x.error)) rejected++; else throw x.error; } } // skip only the row the server refuses
  }
  return rejected;
}

  if((e && e.code==='email_address_invalid') || /email address .* is invalid|invalid format/i.test(msg)) return 'That username can’t be used. Try letters and numbers only.';
  if((e && e.code==='email_not_confirmed') || /not confirmed/i.test(msg)) return 'This account isn’t active yet. Please ask Steven to activate it.';
  if(/password should be|weak/i.test(msg)) return 'Please choose a longer password (at least 8 characters).';

      const entry = logEntry({name:f.name, serv:f.serv||'', servings:f.servings||1, cal:f.cal, p:f.p, c:f.c, f:f.f, fib:f.fib, ...metaOf(f)});
      if(!entry){ closeSheet(); render(); break; }
      el.classList.add('done'); el.textContent='✓'; setTimeout(()=>{ el.classList.remove('done'); el.textContent='+'; }, 1100);
      render();
      break; }
    case 'del-food': { const i = S.foods.findIndex(f=>f.id===el.dataset.id); if(i<0) break; const [f] = S.foods.splice(i,1); save(); renderSheet();
      toast(`Removed ${f.name} from My foods`, ()=>{ S.foods.splice(i,0,f); save(); if(UI.sheet) renderSheet(); }); break; }
    case 'step': { const inp = $('#foodForm [name=servings]'); const cur = num(inp.value)||1;
      const v = Math.max(0.25, Math.round((cur + (+el.dataset.d))*100)/100);
      inp.value = v; inp.closest('.stepper').style.borderColor=''; updatePreview(); break; }
    case 'delete-entry': { const k = UI.date, st = UI.sheet; const e = removeEntry(k, st.id); closeSheet(); render();
      if(e) toast(`Deleted ${e.name}`, ()=>{ restoreEntry(k, e); render(); }); break; }
    case 'wrange': UI.wRange = el.dataset.r; $$('#wRangeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.r===UI.wRange)); drawWeightChart(); break;
    case 'mrange': UI.mRange = +el.dataset.r; UI.mDay = null; paintRangeCards(); break;
    case 'mday': UI.mDay = el.dataset.k; paintRangeCards(); break;
    case 'edit-weight': openWeight(el.dataset.d); break;
    case 'unit': if(S.settings.unit!==el.dataset.u){ S.settings.unit = el.dataset.u; save(); renderSettings(); toast(`Weight units: ${el.dataset.u}`); } break;
    case 'apply-helper': { const r = helperCalc(); if(r.missing){ toast(`Enter your ${r.missing.join(', ')} first`); break; }
      saveProfile(); const fm = $('#goalsForm'); fm.elements.calories.value = r.cal; fm.elements.protein.value = r.protein; fm.elements.fat.value = r.fat; fm.elements.carbs.value = r.carbs;
      if(r.hasT) fm.elements.goalWeight.value = r1(r.t); saveGoals(); break; }
    case 'log-weight': openWeight(UI.view==='today' ? UI.date : todayKey()); break;   // Progress tab: always today
    case 'log-exercise': openExercise(UI.view==='today' ? UI.date : todayKey()); break;
    case 'edit-ex': openExerciseEdit(el.dataset.id); break;
    case 'xtab': if(UI.sheet && UI.sheet.mode==='exercise'){ UI.sheet.tab = el.dataset.tab; renderSheet();
      if(matchMedia('(pointer:fine)').matches){ const i = $(el.dataset.tab==='custom' ? '#exName' : '#exSearch'); if(i) i.focus(); } } break;
    case 'x-pick': if(UI.sheet){ const r = recentExercise().find(r=>r.key==='c:'+el.dataset.code); UI.sheet.code = el.dataset.code; UI.sheet.min = r && r.x.min || 30; UI.sheet.tab = 'detail'; renderSheet(); } break;
    case 'x-recent': if(UI.sheet){ const r = recentExercise().find(r=>r.key===el.dataset.key); if(!r) break; const x = r.x;
      if(x.code){ UI.sheet.code = x.code; UI.sheet.min = x.min || 30; UI.sheet.tab = 'detail'; } else { UI.sheet.name = x.name; UI.sheet.kcal = x.kcal; UI.sheet.cmin = x.min || ''; UI.sheet.tab = 'custom'; }
      renderSheet(); } break;
    case 'x-min': { const i = $('#exMin'); if(i){ i.value = el.dataset.m; UI.sheet.min = +el.dataset.m; $$('[data-act=x-min]').forEach(c=>c.classList.toggle('on', c===el)); i.classList.remove('err'); updateExOut(); } break; }
    case 'x-del': { const k = todayKey(), x = removeExercise(k, UI.sheet.editId); closeSheet(); render(); if(x) toast(`Deleted ${x.name}`, ()=>{ restoreExercise(k, x); render(); }); break; }
    case 'eatback': { const v = el.dataset.v==='1'; if(S.settings.eatBack!==v){ S.settings.eatBack = v; save(); renderSettings(); toast(v ? 'Exercise calories are added to your budget' : 'Exercise calories are no longer added'); } break; }
    case 'q-del-weight': { const w = deleteWeight(UI.sheet && UI.sheet.date); if(!w) break; closeSheet(); render();
      toast('Weigh-in deleted', ()=>{ restoreWeight(w); render(); }); break; }
    case 'auth-open': closeSheet(); openAuth(); break;
    case 'auth-tab': if(UI.sheet && UI.sheet.mode==='auth' && !UI.sheet.busy){ const f = $('#authPwForm'); if(f){ UI.sheet.user = f.elements.username.value.trim(); } UI.sheet.tab = el.dataset.t==='signup' ? 'signup' : 'signin'; UI.sheet.err = ''; UI.sheet.pw = UI.sheet.pw2 = ''; renderSheet(); } break;
    case 'auth-clear': if(await confirmDialog({title:'Remove data from this device?', text:`Changes that were never synced will be lost. Data already backed up stays in ${loadMeta().user||'your account'}.`, ok:'Remove', danger:true})){ clearDevice(); toast('This device’s data was removed'); } break;
    case 'sync-now': syncNow(); break;
    case 'sign-out': signOut(); break;
    case 'sync-prompt-x': try { localStorage.setItem(PROMPT_KEY, '1'); } catch(e){} render(); toast('You can sign in any time from Settings'); break;
  }
});
document.addEventListener('submit', ev=>{
  if(ev.target.id==='authPwForm'){ ev.preventDefault(); authSubmit(ev.target); return; }
  if(ev.target.id==='pwSetForm'){ ev.preventDefault(); const pw = ev.target.elements.pw.value;
    if(pw.length<8){ ev.target.elements.pw.classList.add('err'); toast('Choose a password with at least 8 characters'); return; }
    if(pw!==ev.target.elements.pw2.value){ ev.target.elements.pw2.classList.add('err'); toast('The two passwords don’t match'); return; }
    if(!ACC.client) return;
    ACC.client.auth.updateUser({password:pw}).then(({error})=>{ if(error) toast(authErr(error)); else { ev.target.reset(); toast('Password saved'); } }); return; }
  if(ev.target.id==='qWeightForm'){ ev.preventDefault(); const d = UI.sheet && UI.sheet.date; const r = setWeight(d, ev.target.elements.w.value);
    if(r.err){ ev.target.elements.w.classList.add('err'); toast(r.err); return; }
    closeSheet(); render(); return; }
  if(ev.target.id==='exForm' || ev.target.id==='exCustomForm'){ ev.preventDefault(); submitExercise(ev.target); return; }
  if(ev.target.id==='foodForm') submitForm(ev);
  else if(ev.target.id==='goalsForm'){ ev.preventDefault(); saveGoals(); }
  else if(ev.target.id==='barcodeForm'){ ev.preventDefault(); const v = $('#barcodeInp').value; barcodeLookup(v); }
});
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.id==='customG'){ const g = num(t.value); UI.sheet.grams = g>0 ? g : 0; syncPortionToForm(); }   // (inside #foodForm, so checked first)
  else if(t.closest && t.closest('#foodForm')){ t.classList.remove('err'); if(t.name==='servings') t.closest('.stepper').style.borderColor=''; updatePreview(); }
  else if(t.id==='dbSearch'){ dbQueue(t.value); }
  else if(t.id==='exSearch'){ UI.sheet.q = t.value; $('#exList').innerHTML = exListHTML(); }
  else if(t.id==='exMin' || t.id==='exW'){ t.classList.remove('err'); if(t.id==='exMin'){ UI.sheet.min = t.value; $$('[data-act=x-min]').forEach(c=>c.classList.toggle('on', c.dataset.m===t.value)); } updateExOut(); }
  else if(t.id==='foodSearch'){ UI.sheet.q = t.value; $('#foodList').innerHTML = foodListHTML(); }
  else if(/^h(Sex|Age|Ft|In|Cm|W|T|A|G|P)$/.test(t.id)) updateHelper();
  else if(t.classList && t.classList.contains('err')) t.classList.remove('err');
});
document.addEventListener('change', ev=>{
  if(ev.target.id==='datePick' && ev.target.value){ UI.date = ev.target.value > tomorrowKey() ? tomorrowKey() : ev.target.value; render(); }
  else if(/^h(Sex|Age|Ft|In|Cm|W|T|A|G|P)$/.test(ev.target.id)){ updateHelper(); saveProfile(); }
  else if(ev.target.id==='portionSel' && UI.sheet && UI.sheet.food){ if($('#foodForm')) UI.sheet.form = readForm(); UI.sheet.portion = +ev.target.value; applyPortion(); renderSheet();
    if(UI.sheet.portion===-2){ const c=$('#customG'); if(c){ c.focus(); c.select(); } } }
});
document.addEventListener('toggle', ev=>{ if(ev.target.id==='wList') UI.wOpen = ev.target.open; else if(ev.target.id==='helper') UI.helperOpen = ev.target.open; }, true);
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape'){ if(scanStop) scanStop(); else if($('#dialogRoot').innerHTML) $('#dialogRoot').innerHTML=''; else if(UI.sheet) closeSheet(); }
  else if(ev.key==='Enter' && ev.target.id==='customG'){ ev.preventDefault(); ev.target.blur(); }
  else if(ev.key==='Enter' && ev.target.id==='dbSearch'){ ev.preventDefault(); dbQueue(ev.target.value, true); }
});
window.addEventListener('online', ()=>{ if(UI.sheet && UI.sheet.tab==='search'){ if(UI.sheet.db.status==='offline') UI.sheet.db.status='idle'; paintDb(); } });
window.addEventListener('offline', ()=>{ if(UI.sheet && UI.sheet.tab==='search') paintDb(); });
let rT; window.addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(()=>{ fitTitle(); if(UI.view==='progress'){ drawWeightChart(); paintRangeCards(); } }, 150); });
// Roll over to the new day if the app is left open past midnight
let lastToday = todayKey();
/* day rollover: yesterday becomes locked, tomorrow's planned entries become today's */
function checkRollover(){ const t = todayKey(); if(t===lastToday) return; if(UI.date===lastToday) UI.date = t; lastToday = t; if(UI.sheet && UI.sheet.mode!=='auth') closeSheet(); render(); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkRollover(); });
setInterval(checkRollover, 30000);
// Keep multiple open tabs in sync
window.addEventListener('storage', e=>{ if(e.key===KEY || e.key===null){ S = load(); render(); } else if(e.key===SKEY) paintAccount(); });
// Cloud sync triggers (all no-ops when sync isn't configured or nobody is signed in)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) scheduleSync(300); else if(ACC.client && dirtyCount(loadMeta())) syncNow(); });
window.addEventListener('online', ()=>{ scheduleSync(500); paintAccount(); });
window.addEventListener('offline', ()=>{ if(ACC.client && loadMeta().uid) setSync('offline'); });
setInterval(()=>{ if(!document.hidden && ACC.client) syncNow(); }, 90000);

/* ---------- service worker (offline app shell; http(s) only) ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol==='https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render();
initAccount();
if(mealFixes){ mealFixes = 0; save(); }   // snack → meal migration: saved (and queued for sync) like any other change
})();
</script>
</body>
</html>
