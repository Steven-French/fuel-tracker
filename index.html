    const n = dirtyCount(m);
    const keep = await confirmDialog({title:'Data from another account', text:`This device still has data from ${m.user?'“'+m.user+'”':'another account'}${n?` (${n} change${n===1?'':'s'} never synced)`:''}. Add it to “${userName(user)}”, or remove it from this device?`, ok:'Add to this account', cancel:'Remove it'});
    if(!keep){ S = defaults(); writeLocal(); }
    m = blankMeta(); saveMeta(m); trackChanges();
    m = loadMeta();
  }

    m.uid = user.id; m.user = userName(user); m.cur = {}; m.last = 0;
    const plainProfile = isDefaultProfile();
    for(const k of KINDS) for(const id in m.recs[k]){ if(m.recs[k][id][0]===null) delete m.recs[k][id]; else if(!(k==='p' && plainProfile)) m.dirty[k][id] = 1; }

}
function clearDevice(){

async function signOut(){

window.FuelData = { canFood, canWeight, canExercise, setWeight, deleteWeight, logEntry, removeEntry, updateEntry, restoreEntry, logExercise, updateExercise, removeExercise, restoreExercise };   // data-layer API (used by tests)

/* ---- account UI ---- */
function ago(ms){ const s = (Date.now()-ms)/1000; if(s<45) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return fmtDate(keyOf(new Date(ms)),{month:'short',day:'numeric'}); }
function syncStatusText(m){
  const n = dirtyCount(m), pend = n ? `${n} change${n===1?'':'s'} waiting to sync` : '';
  if(ACC.libErr) return 'Sync is unavailable right now (couldn’t load). Your data is safe on this device.';
  if(!ACC.ready) return 'Connecting…';
  if(ACC.state==='syncing') return 'Syncing…';
  if(ACC.state==='offline' || !navigator.onLine) return 'Offline' + (pend ? ` · ${pend} — they’ll upload when you’re back online` : ' · will sync when you’re back online');
  if(ACC.state==='error') return `Couldn’t sync (${ACC.err.slice(0,120)}) · will retry` + (pend?` · ${pend}`:'');
  if(pend) return pend;
  return m.last ? `Backed up & synced · ${ago(m.last)}` : 'Signed in';
}

/* sign-in sheet: username + password only, no email at all. A username maps to a synthetic, non-routable address
   (<username>@users.fuel-tracker.invalid) that Supabase uses as the unique login; sign-ups are auto-confirmed, so no
   auth flow ever sends an email. The display username is kept in user_metadata.username.
   A forgotten password is reset by Steven with fuel-admin/reset-password.js. */
const USER_DOMAIN = 'users.fuel-tracker.invalid';
const validUser = v => /^[A-Za-z0-9_.]{3,20}$/.test(v) && !/^\.|\.$|\.\./.test(v);
const loginOf = u => u.toLowerCase() + '@' + USER_DOMAIN;
const userName = user => (user && user.user_metadata && user.user_metadata.username) || ((user && user.email) || '').split('@')[0];
function openAuth(tab){ const m = loadMeta(); openSheet({mode:'auth', tab: tab || (m.user ? 'signin' : 'signup'), user:m.user||'', pw:'', pw2:'', busy:false, err:''});
  if(matchMedia('(pointer:fine)').matches) setTimeout(()=>{ const i = $('#authUser'); if(i) i.focus(); }, 50); }
function authSheetHTML(st){
  const up = st.tab==='signup', busy = st.busy ? 'disabled' : '';
  return `<div class="seg" style="margin-bottom:14px" role="tablist"><button type="button" role="tab" class="${up?'':'on'}" data-act="auth-tab" data-t="signin" aria-selected="${!up}">Sign in</button><button type="button" role="tab" class="${up?'on':''}" data-act="auth-tab" data-t="signup" aria-selected="${up}">Create account</button></div>
    <form id="authPwForm" data-how="${up?'signup':'signin'}" novalidate>
      <p class="muted" style="margin:0 0 12px;font-size:14px">${up ? 'Create a free account to back up your log and sync it across your devices. You’re signed in right away.' : 'Welcome back! Sign in to sync this device with your account.'}</p>
      <label class="f"><span>Username</span><input class="inp" id="authUser" type="text" name="username" value="${esc(st.user)}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" ${up?'placeholder="e.g. sam_r"':''} ${busy}></label>
      ${up ? `<p class="muted small" style="margin:-6px 0 10px">3–20 letters, numbers, _ or . — not case-sensitive.</p>` : ''}
      <label class="f"><span>Password</span><input class="inp" type="password" name="password" value="${esc(st.pw)}" autocomplete="${up?'new-password':'current-password'}" ${up?'placeholder="At least 8 characters" minlength="8"':''} ${busy}></label>
      ${up ? `<label class="f"><span>Confirm password</span><input class="inp" type="password" name="password2" value="${esc(st.pw2)}" autocomplete="new-password" ${busy}></label>` : ''}
      ${st.err ? `<div class="notice bad" role="alert">${esc(st.err)}</div>` : ''}
      <button class="btn primary block" type="submit" style="margin-top:4px" ${busy}>${st.busy ? `<span class="spinner"></span> ${up?'Creating account…':'Signing in…'}` : (up?'Create account':'Sign in')}</button>
      <p class="muted small" style="margin:12px 0 0;text-align:center">${up ? 'Keep your password somewhere safe. Forgot it later? Ask Steven to reset it.' : 'Forgot your password? Ask Steven to reset it.'}</p>
      <p class="muted small" style="margin:6px 0 0;text-align:center">Your food log syncs privately to your account; nobody else can see it.</p></form>`;
}
function authErr(e){
  const msg = (e && e.message) || String(e||'Something went wrong');
  if(netErr(e)) return 'You’re offline. Connect to the internet to sign in.';
  if(e && e.status===429) return 'Too many attempts. Please wait a few minutes and try again.';
  if(/invalid login credentials/i.test(msg)) return 'Wrong username or password.';
  if((e && e.code==='user_already_exists') || /already registered|already exists/i.test(msg)) return 'That username is taken. Pick another one (or tap “Sign in” if it’s yours).';
  if((e && e.code==='email_address_invalid') || /email address .* is invalid|invalid format/i.test(msg)) return 'That username can’t be used. Try letters and numbers only.';
  if((e && e.code==='email_not_confirmed') || /not confirmed/i.test(msg)) return 'This account isn’t active yet. Please ask Steven to activate it.';
  if(/password should be|weak/i.test(msg)) return 'Please choose a longer password (at least 8 characters).';
  if(/signups? not allowed/i.test(msg)) return 'New sign-ups are turned off right now.';
  return msg;
}
function authPaint(){ if(UI.sheet && UI.sheet.mode==='auth') renderSheet(); }
async function authRun(fn){ const st = UI.sheet; st.busy = true; st.err = ''; authPaint(); try { await fn(st); } catch(e){ st.err = authErr(e); } if(UI.sheet===st){ st.busy = false; authPaint(); } }
async function finishSignIn(user, created){
  closeSheet(); await adoptUser(user);
  render();
  toast(created ? `Account created · signed in as ${userName(user)}` : `Signed in as ${userName(user)}`);
}
function authSubmit(form){
  const st = UI.sheet; if(!st || st.busy) return;
  if(!ACC.client){ st.err = ACC.libErr ? 'Sync is unavailable right now. Please try again later.' : 'Still connecting… try again in a moment.'; authPaint(); return; }
  const up = st.tab==='signup', user = form.elements.username.value.trim().replace(/^@/, ''), pw = form.elements.password.value, pw2 = up ? form.elements.password2.value : pw;
  Object.assign(st, {user, pw, pw2});
  const fail = m => { st.err = m; authPaint(); };
  if(!user) return fail('Enter your username.');
  if(!validUser(user)) return fail(up ? 'Usernames are 3–20 characters: letters, numbers, _ or . (not starting or ending with a dot).' : 'Wrong username or password.');
  if(!pw) return fail('Enter your password.');
  if(up && pw.length < 8) return fail('Choose a password with at least 8 characters.');
  if(up && pw !== pw2) return fail('The two passwords don’t match.');
  authRun(async st=>{
    if(up){
      const {data, error} = await ACC.client.auth.signUp({email:loginOf(user), password:pw, options:{data:{username:user}}});
      if(error) throw error;
      if(!data.session) throw new Error('Your account was created but isn’t active yet. Please ask Steven to activate it.');
      await finishSignIn(data.user, true);
    } else {
      const {data, error} = await ACC.client.auth.signInWithPassword({email:loginOf(user), password:pw});
      if(error) throw error;
      await finishSignIn(data.user);
    }
  });
}

document.addEventListener('click', async ev=>{
  const tabBtn = ev.target.closest('.tab');
  if(tabBtn){ UI.view = tabBtn.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  switch(a){
    case 'tab': if(UI.sheet) closeSheet(); UI.view = el.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'day': { const n = addDays(UI.date, +el.dataset.d); if(n<=tomorrowKey()){ UI.date = n; render(); } break; }
    case 'goto-today': UI.date = todayKey(); render(); break;
    case 'goto-day': UI.date = el.dataset.k; UI.view='today'; render(); window.scrollTo(0,0); break;
    case 'pick-date': { const i = $('#datePick'); try{ i.showPicker(); } catch(e){ i.style.pointerEvents='auto'; i.focus(); } break; }
    case 'open-add': openAdd(el.dataset.meal); break;
    case 'edit': openEdit(el.dataset.id); break;
    case 'close-sheet': closeSheet(); break;
    case 'meal': if(UI.sheet){ if($('#foodForm')) UI.sheet.form = readForm(); UI.sheet.meal = el.dataset.meal; renderSheet(); } break;
    case 'stab': if(UI.sheet){ if($('#foodForm')) UI.sheet.form = readForm(); UI.sheet.tab = el.dataset.tab; UI.sheet.food = null; renderSheet();
      if(el.dataset.tab==='new' && matchMedia('(pointer:fine)').matches){ const n=$('#foodForm [name=name]'); if(n && !n.value) n.focus(); }
      if(el.dataset.tab==='search' && matchMedia('(pointer:fine)').matches){ const s=$('#dbSearch'); if(s) s.focus(); } } break;
    case 'db-pick': { const f = UI.sheet && UI.sheet.db.results[+el.dataset.i]; if(f) openFoodDetail(f); break; }
    case 'db-back': if(UI.sheet){ UI.sheet.food = null; UI.sheet.tab = 'search'; renderSheet(); } break;
    case 'db-retry': if(UI.sheet){ dbCache.clear(); dbQueue(UI.sheet.db.q, true); } break;
    case 'goto-key': closeSheet(); UI.view='settings'; render(); setTimeout(()=>{ const c=$('#dbCard'); if(c) c.scrollIntoView({block:'center'}); const i=$('#usdaKeyInp'); if(i){ i.focus(); i.select(); } }, 50); break;
    case 'scan': startScan(); break;
    case 'scan-cancel': if(scanStop) scanStop(); break;
    case 'fill': { const f = findFood(el.dataset.src, el.dataset.key); if(!f) break;
      const inFoods = S.foods.some(x=>x.name.trim().toLowerCase()===f.name.trim().toLowerCase());
      UI.sheet.form = {name:f.name, serv:f.serv||'', servings:f.servings||1, cal:f.cal, p:f.p, c:f.c, f:f.f, fib:f.fib, saveFood:false, inFoods}; UI.sheet.tab='new'; UI.sheet.food=null; renderSheet(); break; }
    case 'quick': { const f = findFood(el.dataset.src, el.dataset.key); if(!f) break;
      const k = UI.date, entry = logEntry({name:f.name, serv:f.serv||'', servings:f.servings||1, cal:f.cal, p:f.p, c:f.c, f:f.f, fib:f.fib});
      if(!entry){ closeSheet(); render(); break; }
      el.classList.add('done'); el.textContent='✓'; setTimeout(()=>{ el.classList.remove('done'); el.textContent='+'; }, 1100);
      render();
      toast(`Logged ${entry.name} · ${MEAL_LABEL[entry.meal]}`, ()=>{ removeEntry(k, entry.id); render(); });
      break; }
    case 'del-food': { const i = S.foods.findIndex(f=>f.id===el.dataset.id); if(i<0) break; const [f] = S.foods.splice(i,1); save(); renderSheet();
      toast(`Removed ${f.name} from My foods`, ()=>{ S.foods.splice(i,0,f); save(); if(UI.sheet) renderSheet(); }); break; }
    case 'step': { const inp = $('#foodForm [name=servings]'); const cur = num(inp.value)||1;
      const v = Math.max(0.25, Math.round((cur + (+el.dataset.d))*100)/100);
      inp.value = v; inp.closest('.stepper').style.borderColor=''; updatePreview(); break; }
    case 'delete-entry': { const k = UI.date, st = UI.sheet; const e = removeEntry(k, st.id); closeSheet(); render();
      if(e) toast(`Deleted ${e.name}`, ()=>{ restoreEntry(k, e); render(); }); break; }
    case 'copy-day': copyEntries(S.entries[addDays(UI.date,-1)]||[]); break;
    case 'copy-meal': copyEntries((S.entries[addDays(UI.date,-1)]||[]).filter(e=>e.meal===el.dataset.meal)); break;
    case 'wrange': UI.wRange = el.dataset.r; $$('#wRangeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.r===UI.wRange)); drawWeightChart(); break;
    case 'mrange': UI.mRange = +el.dataset.r; UI.mDay = null; paintRangeCards(); break;
    case 'mday': UI.mDay = el.dataset.k; paintRangeCards(); break;
    case 'edit-weight': openWeight(el.dataset.d); break;
    case 'unit': if(S.settings.unit!==el.dataset.u){ S.settings.unit = el.dataset.u; save(); renderSettings(); toast(`Weight units: ${el.dataset.u}`); } break;
    case 'apply-helper': { const r = helperCalc(); if(r.missing){ toast(`Enter your ${r.missing.join(', ')} first`); break; }
      saveProfile(); const fm = $('#goalsForm'); fm.elements.calories.value = r.cal; fm.elements.protein.value = r.protein; fm.elements.fat.value = r.fat; fm.elements.carbs.value = r.carbs;
      if(r.hasT) fm.elements.goalWeight.value = r1(r.t); saveGoals(); break; }
    case 'export': exportData(); break;
    case 'log-weight': openWeight(UI.view==='today' ? UI.date : todayKey()); break;   // Progress tab: always today
    case 'log-exercise': openExercise(UI.view==='today' ? UI.date : todayKey()); break;
    case 'edit-ex': openExerciseEdit(el.dataset.id); break;
    case 'xtab': if(UI.sheet && UI.sheet.mode==='exercise'){ UI.sheet.tab = el.dataset.tab; renderSheet();
      if(matchMedia('(pointer:fine)').matches){ const i = $(el.dataset.tab==='custom' ? '#exName' : '#exSearch'); if(i) i.focus(); } } break;
    case 'x-pick': if(UI.sheet){ const r = recentExercise().find(r=>r.key==='c:'+el.dataset.code); UI.sheet.code = el.dataset.code; UI.sheet.min = r && r.x.min || 30; UI.sheet.tab = 'detail'; renderSheet(); } break;
    case 'x-recent': if(UI.sheet){ const r = recentExercise().find(r=>r.key===el.dataset.key); if(!r) break; const x = r.x;
      if(x.code){ UI.sheet.code = x.code; UI.sheet.min = x.min || 30; UI.sheet.tab = 'detail'; } else { UI.sheet.name = x.name; UI.sheet.kcal = x.kcal; UI.sheet.cmin = x.min || ''; UI.sheet.tab = 'custom'; }
      renderSheet(); } break;
    case 'x-min': { const i = $('#exMin'); if(i){ i.value = el.dataset.m; UI.sheet.min = +el.dataset.m; $$('[data-act=x-min]').forEach(c=>c.classList.toggle('on', c===el)); i.classList.remove('err'); updateExOut(); } break; }
    case 'x-del': { const k = todayKey(), x = removeExercise(k, UI.sheet.editId); closeSheet(); render(); if(x) toast(`Deleted ${x.name}`, ()=>{ restoreExercise(k, x); render(); }); break; }
    case 'eatback': { const v = el.dataset.v==='1'; if(S.settings.eatBack!==v){ S.settings.eatBack = v; save(); renderSettings(); toast(v ? 'Exercise calories are added to your budget' : 'Exercise calories are no longer added'); } break; }
    case 'q-del-weight': { const w = deleteWeight(UI.sheet && UI.sheet.date); if(!w) break; closeSheet(); render();
      toast('Weigh-in deleted', ()=>{ restoreWeight(w); render(); }); break; }
    case 'auth-open': closeSheet(); openAuth(); break;
    case 'auth-tab': if(UI.sheet && UI.sheet.mode==='auth' && !UI.sheet.busy){ const f = $('#authPwForm'); if(f){ UI.sheet.user = f.elements.username.value.trim(); } UI.sheet.tab = el.dataset.t==='signup' ? 'signup' : 'signin'; UI.sheet.err = ''; UI.sheet.pw = UI.sheet.pw2 = ''; renderSheet(); } break;
    case 'auth-clear': if(await confirmDialog({title:'Remove data from this device?', text:`Changes that were never synced will be lost. Data already backed up stays in ${loadMeta().user||'your account'}.`, ok:'Remove', danger:true})){ clearDevice(); toast('This device’s data was removed'); } break;
    case 'sync-now': syncNow(); break;
    case 'sign-out': signOut(); break;
    case 'sync-prompt-x': try { localStorage.setItem(PROMPT_KEY, '1'); } catch(e){} render(); toast('You can sign in any time from Settings'); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': { const ok = await confirmDialog({title:'Reset all data?', text:`This permanently deletes all food logs, saved foods, weigh-ins, exercise and goals ${CFG && loadMeta().uid ? 'on this device and in your account, on all your devices' : 'on this device'}. Consider exporting a backup first.`, ok:'Delete everything', danger:true});
      if(ok){ S = defaults(); save(); UI.date = todayKey(); UI.view='today'; render(); toast('All data reset'); } break; }
  }
});
document.addEventListener('submit', ev=>{
  if(ev.target.id==='authPwForm'){ ev.preventDefault(); authSubmit(ev.target); return; }
  if(ev.target.id==='pwSetForm'){ ev.preventDefault(); const pw = ev.target.elements.pw.value;
    if(pw.length<8){ ev.target.elements.pw.classList.add('err'); toast('Choose a password with at least 8 characters'); return; }
    if(pw!==ev.target.elements.pw2.value){ ev.target.elements.pw2.classList.add('err'); toast('The two passwords don’t match'); return; }
    if(!ACC.client) return;
    ACC.client.auth.updateUser({password:pw}).then(({error})=>{ if(error) toast(authErr(error)); else { ev.target.reset(); toast('Password saved'); } }); return; }
  if(ev.target.id==='qWeightForm'){ ev.preventDefault(); const d = UI.sheet && UI.sheet.date; const r = setWeight(d, ev.target.elements.w.value);
    if(r.err){ ev.target.elements.w.classList.add('err'); toast(r.err); return; }
    closeSheet(); render(); toast(r.updated ? 'Weigh-in updated' : 'Weigh-in saved'); return; }
  if(ev.target.id==='exForm' || ev.target.id==='exCustomForm'){ ev.preventDefault(); submitExercise(ev.target); return; }
  if(ev.target.id==='foodForm') submitForm(ev);
  else if(ev.target.id==='goalsForm'){ ev.preventDefault(); saveGoals(); }
  else if(ev.target.id==='barcodeForm'){ ev.preventDefault(); const v = $('#barcodeInp').value; barcodeLookup(v); }
  else if(ev.target.id==='keyForm'){ ev.preventDefault(); const v = ev.target.elements.key.value.trim();
    if(v && !/^[A-Za-z0-9_\-]{6,100}$/.test(v)){ ev.target.elements.key.classList.add('err'); toast('That doesn’t look like an API key'); return; }
    S.settings.usdaKey = (!v || v==='DEMO_KEY' || v===APP_USDA_KEY) ? '' : v; save(); dbCache.clear(); renderSettings(); toast(S.settings.usdaKey ? 'USDA API key saved' : APP_USDA_KEY ? 'Using the built-in USDA key' : 'Using DEMO_KEY'); }
});
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.closest && t.closest('#foodForm')){ t.classList.remove('err'); if(t.name==='servings') t.closest('.stepper').style.borderColor=''; updatePreview(); }
  else if(t.id==='dbSearch'){ dbQueue(t.value); }
  else if(t.id==='customG'){ const g = num(t.value); UI.sheet.grams = g>0 ? g : 0; syncPortionToForm(); }
  else if(t.id==='exSearch'){ UI.sheet.q = t.value; $('#exList').innerHTML = exListHTML(); }
  else if(t.id==='exMin' || t.id==='exW'){ t.classList.remove('err'); if(t.id==='exMin'){ UI.sheet.min = t.value; $$('[data-act=x-min]').forEach(c=>c.classList.toggle('on', c.dataset.m===t.value)); } updateExOut(); }
  else if(t.id==='foodSearch'){ UI.sheet.q = t.value; $('#foodList').innerHTML = foodListHTML(); }
  else if(/^h(Sex|Age|Ft|In|Cm|W|T|A|G|P)$/.test(t.id)) updateHelper();
  else if(t.classList && t.classList.contains('err')) t.classList.remove('err');
});
document.addEventListener('change', ev=>{

    if(UI.sheet.portion===-2){ const c=$('#customG'); if(c){ c.focus(); c.select(); } } }
});
document.addEventListener('toggle', ev=>{ if(ev.target.id==='wList') UI.wOpen = ev.target.open; else if(ev.target.id==='helper') UI.helperOpen = ev.target.open; }, true);

// Roll over to the new day if the app is left open past midnight
let lastToday = todayKey();
/* day rollover: yesterday becomes locked, tomorrow's planned entries become today's */
function checkRollover(){ const t = todayKey(); if(t===lastToday) return; if(UI.date===lastToday) UI.date = t; lastToday = t; if(UI.sheet && UI.sheet.mode!=='auth') closeSheet(); render(); }
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkRollover(); });
setInterval(checkRollover, 30000);
// Keep multiple open tabs in sync
window.addEventListener('storage', e=>{ if(e.key===KEY || e.key===null){ S = load(); render(); } else if(e.key===SKEY) paintAccount(); });
// Cloud sync triggers (all no-ops when sync isn't configured or nobody is signed in)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) scheduleSync(300); else if(ACC.client && dirtyCount(loadMeta())) syncNow(); });
window.addEventListener('online', ()=>{ scheduleSync(500); paintAccount(); });
window.addEventListener('offline', ()=>{ if(ACC.client && loadMeta().uid) setSync('offline'); });
setInterval(()=>{ if(!document.hidden && ACC.client) syncNow(); }, 90000);

/* ---------- service worker (offline app shell; http(s) only) ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol==='https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render();
initAccount();
if(mealFixes){ mealFixes = 0; save(); }   // snack → meal migration: saved (and queued for sync) like any other change
})();
</script>
</body>
</html>
