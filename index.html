/* ---------- cloud account & sync (Supabase) ----------
   Local-first: localStorage (S) stays the working copy and the app works fully without an account.
   * trackChanges() runs after every save(): it compares each record with a fingerprint of its last known state,
     so edits, deletes, imports and resets are all caught in one place. Changed records are marked dirty with a
     change time; deleted ones become tombstones.
   * sync = pull (rows changed on the server since our cursor) then push (dirty rows, upserted with their change time).
     The server keeps the newest change per record (last write wins) and stores deletes as tombstones.
   * Triggers: app open, returning to the app, coming back online, ~2 s after an edit, and every 90 s while visible.
   * The feature is hidden unless config.js has a project URL + public key. The Supabase API is never cached by sw.js. */
var SYNC_ON = false;
const CFG = (()=>{
  const c = window.FUEL_CONFIG || {};
  const url = String(c.supabaseUrl||'').trim().replace(/\/+$/,''), key = String(c.supabaseKey||'').trim();
  if(!/^https?:\/\/\S+$/.test(url) || !key) return null;
  if(/^sb_secret_/i.test(key)) return null;                         // never run with a secret key
  try { const p = key.split('.'); if(p.length===3){ const j = JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/'))); if(j.role && j.role!=='anon') return null; } } catch(e){}
  return {url, key};
})();
const SKEY = 'fuel.sync.v1', PROMPT_KEY = 'fuel.syncPrompt.dismissed';
const TABLE = {p:'profiles', e:'food_entries', f:'saved_foods', w:'weight_entries'};
const KINDS = ['p','e','f','w'];
const NULLS = {
  e:{day:null, meal:null, name:null, servings:null, calories:null, protein:null, carbs:null, fat:null, fiber:null, serving:null, logged_at:null},
  f:{name:null, servings:null, calories:null, protein:null, carbs:null, fat:null, fiber:null, serving:null},
  w:{day:null, kg:null}
};
const ACC = {client:null, ready:false, expired:false, state:'idle', err:'', libErr:false};
const blankMeta = () => ({v:1, uid:null, user:null, recs:{p:{},e:{},f:{},w:{}}, dirty:{p:{},e:{},f:{},w:{}}, cur:{}, last:0, rejected:0});
function loadMeta(){ try { const m = JSON.parse(localStorage.getItem(SKEY)); if(m && m.v===1 && m.recs && m.dirty){ KINDS.forEach(k=>{ m.recs[k]=m.recs[k]||{}; m.dirty[k]=m.dirty[k]||{}; }); m.cur=m.cur||{}; return m; } } catch(e){} return blankMeta(); }
function saveMeta(m){ try { localStorage.setItem(SKEY, JSON.stringify(m)); } catch(e){} }
const dirtyCount = m => KINDS.reduce((n,k)=>n+Object.keys(m.dirty[k]).length, 0);
const fp = o => hex32(cyrb128(JSON.stringify(o)).slice(0,2));   // 64-bit fingerprint of a record's synced fields

/* local record -> server columns (clamped to the server's CHECK limits so one odd value can't block a batch) */
const cl = (v, max) => { v = +v; return isFinite(v) && v>=0 ? Math.min(v, max) : 0; };
const goal = (v, max) => { v = +v; return isFinite(v) && v>0 ? Math.min(v, max) : null; };
const validDay = k => typeof k==='string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && keyOf(parseKey(k))===k;
const isoMs = ms => { ms = +ms; return isFinite(ms) && Math.abs(ms) < 8e15 ? new Date(ms).toISOString() : null; };
const rowE = (k, e) => validDay(k) ? {day:k, meal:MEAL_LABEL[e.meal]?e.meal:'snack', name:String(e.name||'Food').slice(0,200), servings:cl(e.servings,99999), calories:cl(e.cal,999999),
  protein:cl(e.p,99999), carbs:cl(e.c,99999), fat:cl(e.f,99999), fiber:cl(e.fib,99999), serving:e.serv?String(e.serv).slice(0,120):null, logged_at:isoMs(e.ts)} : null;
const rowF = f => ({name:String(f.name||'Food').slice(0,200), servings:cl(f.servings,99999), calories:cl(f.cal,999999), protein:cl(f.p,99999), carbs:cl(f.c,99999), fat:cl(f.f,99999), fiber:cl(f.fib,99999), serving:f.serv?String(f.serv).slice(0,120):null});
const rowW = w => validDay(w.date) && +w.kg>0 ? {day:w.date, kg:Math.min(+w.kg, 999)} : null;
function rowP(){ const st = S.settings, g = st.goals;
  return {unit:st.unit==='kg'?'kg':'lb', goal_calories:goal(g.calories,99999), goal_protein:goal(g.protein,9999), goal_carbs:goal(g.carbs,9999), goal_fat:goal(g.fat,9999), goal_fiber:goal(g.fiber,9999),
    goals_set:!!st.goalsSet, usda_key:(st.usdaKey||'').slice(0,100)||null,
    goal_weight_kg:st.goalWeight>0 && st.goalWeight<1000 ? st.goalWeight : null, goal_weight_start_kg:st.goalWeight && st.goalWeightStart>0 && st.goalWeightStart<1000 ? st.goalWeightStart : null}; }
const isDefaultProfile = () => fp(rowP()) === fp((()=>{ const keep = S; S = defaults(); const r = rowP(); S = keep; return r; })());

/* server row -> local record */
function entryFromRow(r){ const e = {id:r.id, name:String(r.name||'Food').slice(0,120), meal:MEAL_LABEL[r.meal]?r.meal:'snack', servings:nz(r.servings)||1, cal:nz(r.calories), p:nz(r.protein), c:nz(r.carbs), f:nz(r.fat), fib:nz(r.fiber),
  ts:Date.parse(r.logged_at)||Date.parse(r.updated_at)||Date.now()}; if(r.serving) e.serv = String(r.serving).slice(0,80); return e; }
function foodFromRow(r){ const f = {id:r.id, name:String(r.name||'Food').slice(0,120), cal:nz(r.calories), p:nz(r.protein), c:nz(r.carbs), f:nz(r.fat), fib:nz(r.fiber), servings:nz(r.servings)||1}; if(r.serving) f.serv = String(r.serving).slice(0,80); return f; }
function profileFromRow(r){ const st = S.settings, d = defaults().settings.goals;
  st.unit = r.unit==='kg'?'kg':'lb'; st.goalsSet = !!r.goals_set; st.usdaKey = typeof r.usda_key==='string' ? r.usda_key.slice(0,100) : '';
  st.goals = {calories:nz(r.goal_calories)||d.calories, protein:nz(r.goal_protein)||d.protein, carbs:nz(r.goal_carbs)||null, fat:nz(r.goal_fat)||null, fiber:nz(r.goal_fiber)||null};
  st.goalWeight = nz(r.goal_weight_kg)||null; st.goalWeightStart = st.goalWeight ? (nz(r.goal_weight_start_kg)||null) : null; }

function snapshot(){
  const o = {p:{me:fp(rowP())}, e:{}, f:{}, w:{}};
  for(const k of Object.keys(S.entries)) for(const e of S.entries[k]) o.e[e.id] = fp(rowE(k,e));
  for(const f of S.foods) o.f[f.id] = fp(rowF(f));
  for(const w of S.weights) o.w[weightId(w.date)] = fp(rowW(w));
  return o;
}
/* Change tracker, called by save(). While the device belongs to an account (meta.uid), changes are queued for upload. */
function trackChanges(){
  if(!SYNC_ON) return 0;
  const m = loadMeta(), snap = snapshot(), now = Date.now(), owned = !!m.uid; let n = 0;
  for(const k of KINDS){ const R = m.recs[k], cur = snap[k];
    for(const id in cur){ const r = R[id]; if(!r || r[0]!==cur[id]){ R[id] = [cur[id], now]; if(owned){ m.dirty[k][id] = 1; n++; } } }
    for(const id in R){ if(!(id in cur) && R[id][0]!==null){ if(owned){ R[id] = [null, now]; m.dirty[k][id] = 1; n++; } else delete R[id]; } }
  }
  saveMeta(m);
  if(n && ACC.client){ scheduleSync(2000); paintAccount(); }
  return n;
}
function writeLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* apply rows pulled from the server; a local change that is newer and not yet uploaded wins */
function applyRemote(k, rows){
  const m = loadMeta(); let changed = false;
  const where = new Map(); if(k==='e') for(const d in S.entries) for(const e of S.entries[d]) where.set(e.id, d);
  for(const r of rows){
    const id = k==='p' ? 'me' : r.id, rt = Date.parse(r.updated_at)||0, R = m.recs[k][id];
    if(m.dirty[k][id] && R && R[1] > rt) continue;
    if(k==='p'){ const before = JSON.stringify(S.settings); profileFromRow(r); if(JSON.stringify(S.settings)!==before) changed = true; m.recs.p.me = [fp(rowP()), rt]; delete m.dirty.p.me; continue; }
    if(r.deleted){
      if(k==='e'){ const d = where.get(id); if(d){ S.entries[d] = S.entries[d].filter(e=>e.id!==id); if(!S.entries[d].length) delete S.entries[d]; where.delete(id); changed = true; } }
      else if(k==='f'){ const i = S.foods.findIndex(f=>f.id===id); if(i>=0){ S.foods.splice(i,1); changed = true; } }
      else { const i = S.weights.findIndex(w=>weightId(w.date)===id); if(i>=0){ S.weights.splice(i,1); changed = true; } }
      delete m.recs[k][id]; delete m.dirty[k][id]; continue;
    }
    let h;
    if(k==='e'){ const e = entryFromRow(r), d = where.get(id);
      if(d && d!==r.day){ S.entries[d] = S.entries[d].filter(x=>x.id!==id); if(!S.entries[d].length) delete S.entries[d]; }
      const list = S.entries[r.day] = S.entries[r.day]||[]; const i = list.findIndex(x=>x.id===id);
      if(i>=0){ if(JSON.stringify(list[i])!==JSON.stringify(e)){ list[i] = e; changed = true; } } else { list.push(e); changed = true; }
      where.set(id, r.day); h = fp(rowE(r.day, e));
    } else if(k==='f'){ const f = foodFromRow(r), i = S.foods.findIndex(x=>x.id===id);
      if(i>=0){ if(JSON.stringify(S.foods[i])!==JSON.stringify(f)){ S.foods[i] = f; changed = true; } } else { S.foods.push(f); changed = true; }
      h = fp(rowF(f));
    } else { const w = {date:r.day, kg:nz(r.kg)}, i = S.weights.findIndex(x=>x.date===r.day);
      if(i>=0){ if(S.weights[i].kg!==w.kg){ S.weights[i] = w; changed = true; } } else { S.weights.push(w); S.weights.sort((a,b)=>a.date<b.date?-1:1); changed = true; }
      h = fp(rowW(w));
    }
    m.recs[k][id] = [h, rt]; delete m.dirty[k][id];
  }
  saveMeta(m);
  if(changed) writeLocal();
  return changed;
}

let syncTimer = null, syncing = null, syncAgain = false, pendingRender = false;
function scheduleSync(ms){ if(!ACC.client) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>{ syncNow(); }, ms); }
function syncNow(){
  if(!ACC.client || !loadMeta().uid) return Promise.resolve();
  if(syncing){ syncAgain = true; return syncing; }
  const locked = fn => (navigator.locks && navigator.locks.request) ? navigator.locks.request('fuel-sync', fn) : fn();  // one sync at a time across tabs
  syncing = (async()=>{ do { syncAgain = false; await locked(syncOnce); } while(syncAgain); })().finally(()=>{ syncing = null; });
  return syncing;
}
const netErr = e => !navigator.onLine || /failed to fetch|networkerror|network request failed|load failed|fetch failed|timeout|aborted/i.test((e && (e.message||e.details))||'') || (e && e.status===0);
function setSync(state, err){ ACC.state = state; ACC.err = err||''; paintAccount(); }
async function syncOnce(){
  if(!navigator.onLine){ setSync('offline'); return; }
  const {data, error} = await ACC.client.auth.getSession();
  const session = data && data.session;
  if(!session){ if(error && netErr(error)) setSync('offline'); else { ACC.expired = true; setSync('idle'); } return; }
  const meta0 = loadMeta();
  if(!meta0.uid || meta0.uid!==session.user.id){ setSync('idle'); return; }
  setSync('syncing');
  try {
    S = load(); trackChanges();              // pick up edits made in other tabs before merging
    let changed = false;
    for(const k of KINDS) if(await pull(k, session.user.id)) changed = true;
    await push(session.user.id);
    const m = loadMeta(); m.last = Date.now(); saveMeta(m);
    setSync('ok');
    if(changed) onRemoteChange();
  } catch(e){ setSync(netErr(e) ? 'offline' : 'error', (e && e.message) || String(e)); }
}
async function pull(k, userId){
  let m = loadMeta();
  const since = m.cur[k] ? new Date(Date.parse(m.cur[k]) - 60000).toISOString() : null;  // 60 s overlap: never miss a row committed late
  let from = 0, last = null, changed = false;
  for(;;){
    let q = ACC.client.from(TABLE[k]).select('*').eq('user_id', userId);
    if(since) q = q.gte('synced_at', since);
    q = q.order('synced_at', {ascending:true}); if(k!=='p') q = q.order('id', {ascending:true});
    const {data, error} = await q.range(from, from+999); if(error) throw error;
    if(data.length){ if(applyRemote(k, data)) changed = true; last = data[data.length-1].synced_at; }
    if(data.length < 1000) break; from += 1000;
  }
  if(last){ m = loadMeta(); if(!m.cur[k] || Date.parse(last) >= Date.parse(m.cur[k])) m.cur[k] = last; saveMeta(m); }
  return changed;
}
async function push(userId){
  let m = loadMeta();
  const E = new Map(); for(const d in S.entries) for(const e of S.entries[d]) E.set(e.id, [d,e]);
  const F = new Map(S.foods.map(f=>[f.id,f])), W = new Map(S.weights.map(w=>[weightId(w.date), w]));
  for(const k of KINDS){
    const ids = Object.keys(m.dirty[k]); if(!ids.length) continue;
    const rows = [], sent = [];
    for(const id of ids){
      const R = m.recs[k][id]; let data = null;
      if(R){ if(k==='p') data = rowP(); else if(R[0]===null) data = {deleted:true, ...NULLS[k]};
        else { const x = k==='e' ? E.get(id) : k==='f' ? F.get(id) : W.get(id); const r = x && (k==='e' ? rowE(x[0], x[1]) : k==='f' ? rowF(x) : rowW(x)); if(r) data = {deleted:false, ...r}; } }
      if(!data){ delete m.dirty[k][id]; continue; }                       // nothing sendable (stale marker or invalid date)
      const row = {user_id:userId, updated_at:new Date(R[1]).toISOString(), ...data}; if(k!=='p') row.id = id;
      rows.push(row); sent.push([id, R[1], R[0]===null]);
    }
    saveMeta(m);
    const rejected = await upsertRows(k, rows);
    m = loadMeta();
    for(const [id, t, del] of sent){ const R = m.recs[k][id]; if(R && R[1]===t){ delete m.dirty[k][id]; if(del) delete m.recs[k][id]; } }
    m.rejected = (m.rejected||0) + rejected;
    saveMeta(m);
  }
}
async function upsertRows(k, rows){
  const onConflict = k==='p' ? 'user_id' : 'user_id,id', dataErr = e => /^(22|23)/.test((e && e.code)||''); let rejected = 0;
  for(let i=0; i<rows.length; i+=500){
    const chunk = rows.slice(i, i+500);
    const {error} = await ACC.client.from(TABLE[k]).upsert(chunk, {onConflict});
    if(!error) continue;
    if(!dataErr(error)) throw error;
    for(const r of chunk){ const x = await ACC.client.from(TABLE[k]).upsert(r, {onConflict}); if(x.error){ if(dataErr(x.error)) rejected++; else throw x.error; } } // skip only the row the server refuses
  }
  return rejected;
}

async function adoptUser(user){

    const n = dirtyCount(m);
    const keep = await confirmDialog({title:'Data from another account', text:`This device still has data from ${m.user?'“'+m.user+'”':'another account'}${n?` (${n} change${n===1?'':'s'} never synced)`:''}. Add it to “${userName(user)}”, or remove it from this device?`, ok:'Add to this account', cancel:'Remove it'});
    if(!keep){ S = defaults(); writeLocal(); }
    m = blankMeta(); saveMeta(m); trackChanges();
    m = loadMeta();
  }
  if(!m.uid){
    m.uid = user.id; m.user = userName(user); m.cur = {}; m.last = 0;
    const plainProfile = isDefaultProfile();
    for(const k of KINDS) for(const id in m.recs[k]){ if(m.recs[k][id][0]===null) delete m.recs[k][id]; else if(!(k==='p' && plainProfile)) m.dirty[k][id] = 1; }
    if(plainProfile && m.recs.p.me) m.recs.p.me[1] = 0;   // a fresh device's default goals never overwrite the account's goals
    saveMeta(m);
  }

function authErr(e){
  const msg = (e && e.message) || String(e||'Something went wrong');
  if(netErr(e)) return 'You’re offline. Connect to the internet to sign in.';
  if(e && e.status===429) return 'Too many attempts. Please wait a few minutes and try again.';
  if(/invalid login credentials/i.test(msg)) return 'Wrong username or password.';
  if((e && e.code==='user_already_exists') || /already registered|already exists/i.test(msg)) return 'That username is taken. Pick another one (or tap “Sign in” if it’s yours).';
  if((e && e.code==='email_address_invalid') || /email address .* is invalid|invalid format/i.test(msg)) return 'That username can’t be used. Try letters and numbers only.';
  if((e && e.code==='email_not_confirmed') || /not confirmed/i.test(msg)) return 'This account isn’t active yet. Please ask Steven to activate it.';
  if(/password should be|weak/i.test(msg)) return 'Please choose a longer password (at least 8 characters).';
  if(/signups? not allowed/i.test(msg)) return 'New sign-ups are turned off right now.';

      break; }
    case 'del-food': { const i = S.foods.findIndex(f=>f.id===el.dataset.id); if(i<0) break; const [f] = S.foods.splice(i,1); save(); renderSheet();
      toast(`Removed ${f.name} from My foods`, ()=>{ S.foods.splice(i,0,f); save(); if(UI.sheet) renderSheet(); }); break; }
    case 'step': { const inp = $('#foodForm [name=servings]'); const cur = num(inp.value)||1;
      const v = Math.max(0.25, Math.round((cur + (+el.dataset.d))*100)/100);
      inp.value = v; inp.closest('.stepper').style.borderColor=''; updatePreview(); break; }
    case 'delete-entry': { const k = UI.date, st = UI.sheet; const e = removeEntry(k, st.id); closeSheet(); render();
      if(e) toast(`Deleted ${e.name}`, ()=>{ (S.entries[k]=S.entries[k]||[]).push(e); save(); render(); }); break; }
    case 'copy-day': copyEntries(S.entries[addDays(UI.date,-1)]||[]); break;
    case 'copy-meal': copyEntries((S.entries[addDays(UI.date,-1)]||[]).filter(e=>e.meal===el.dataset.meal)); break;
    case 'wrange': UI.wRange = el.dataset.r; renderWeight(); break;
    case 'del-weight': { const i = S.weights.findIndex(w=>w.date===el.dataset.d); if(i<0) break; const [w] = S.weights.splice(i,1); save(); renderWeight();
      toast('Weigh-in deleted', ()=>{ S.weights.push(w); S.weights.sort((a,b)=>a.date<b.date?-1:1); save(); renderWeight(); }); break; }
    case 'unit': if(S.settings.unit!==el.dataset.u){ S.settings.unit = el.dataset.u; save(); renderSettings(); toast(`Weight units: ${el.dataset.u}`); } break;
    case 'apply-helper': { const r = helperCalc(); if(!r){ toast('Enter your body weight first'); break; }
      const fm = $('#goalsForm'); fm.elements.calories.value = r.cal; fm.elements.protein.value = r.protein; saveGoals(); break; }
    case 'export': exportData(); break;
    case 'log-weight': openWeight(UI.date); break;
    case 'q-del-weight': { const d = UI.sheet && UI.sheet.date; const i = S.weights.findIndex(w=>w.date===d); if(i<0) break; const [w] = S.weights.splice(i,1); save(); closeSheet(); render();
      toast('Weigh-in deleted', ()=>{ S.weights.push(w); S.weights.sort((a,b)=>a.date<b.date?-1:1); save(); render(); }); break; }
    case 'auth-open': closeSheet(); openAuth(); break;
    case 'auth-tab': if(UI.sheet && UI.sheet.mode==='auth' && !UI.sheet.busy){ const f = $('#authPwForm'); if(f){ UI.sheet.user = f.elements.username.value.trim(); } UI.sheet.tab = el.dataset.t==='signup' ? 'signup' : 'signin'; UI.sheet.err = ''; UI.sheet.pw = UI.sheet.pw2 = ''; renderSheet(); } break;
    case 'auth-clear': if(await confirmDialog({title:'Remove data from this device?', text:`Changes that were never synced will be lost. Data already backed up stays in ${loadMeta().user||'your account'}.`, ok:'Remove', danger:true})){ clearDevice(); toast('This device’s data was removed'); } break;
    case 'sync-now': syncNow(); break;
    case 'sign-out': signOut(); break;
    case 'sync-prompt-x': try { localStorage.setItem(PROMPT_KEY, '1'); } catch(e){} render(); toast('You can sign in any time from Goals'); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': { const ok = await confirmDialog({title:'Reset all data?', text:`This permanently deletes all food logs, saved foods, weigh-ins and goals ${CFG && loadMeta().uid ? 'on this device and in your account, on all your devices' : 'on this device'}. Consider exporting a backup first.`, ok:'Delete everything', danger:true});
      if(ok){ S = defaults(); save(); UI.date = todayKey(); UI.view='today'; render(); toast('All data reset'); } break; }
  }
});
document.addEventListener('submit', ev=>{
  if(ev.target.id==='authPwForm'){ ev.preventDefault(); authSubmit(ev.target); return; }
  if(ev.target.id==='pwSetForm'){ ev.preventDefault(); const pw = ev.target.elements.pw.value;
    if(pw.length<8){ ev.target.elements.pw.classList.add('err'); toast('Choose a password with at least 8 characters'); return; }
    if(pw!==ev.target.elements.pw2.value){ ev.target.elements.pw2.classList.add('err'); toast('The two passwords don’t match'); return; }
    if(!ACC.client) return;
    ACC.client.auth.updateUser({password:pw}).then(({error})=>{ if(error) toast(authErr(error)); else { ev.target.reset(); toast('Password saved'); } }); return; }
  if(ev.target.id==='qWeightForm'){ ev.preventDefault(); const d = UI.sheet && UI.sheet.date; const r = setWeight(d, ev.target.elements.w.value);
    if(r.err){ ev.target.elements.w.classList.add('err'); toast(r.err); return; }
    closeSheet(); render(); toast(r.updated ? 'Weigh-in updated' : 'Weigh-in saved'); return; }
  if(ev.target.id==='foodForm') submitForm(ev);
  else if(ev.target.id==='goalsForm'){ ev.preventDefault(); saveGoals(); }
  else if(ev.target.id==='barcodeForm'){ ev.preventDefault(); const v = $('#barcodeInp').value; barcodeLookup(v); }
  else if(ev.target.id==='keyForm'){ ev.preventDefault(); const v = ev.target.elements.key.value.trim();
    if(v && !/^[A-Za-z0-9_\-]{6,100}$/.test(v)){ ev.target.elements.key.classList.add('err'); toast('That doesn’t look like an API key'); return; }
    S.settings.usdaKey = (!v || v==='DEMO_KEY') ? '' : v; save(); dbCache.clear(); renderSettings(); toast(S.settings.usdaKey ? 'USDA API key saved' : 'Using DEMO_KEY'); }
  else if(ev.target.id==='weightForm'){
    ev.preventDefault(); const fm = ev.target; const r = setWeight(fm.elements.d.value, fm.elements.w.value);
    if(r.err){ if(/weight/.test(r.err)) fm.elements.w.classList.add('err'); toast(r.err); return; }
    renderWeight(); toast(r.updated ? 'Weigh-in updated' : 'Weigh-in saved');
  }
});
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.closest && t.closest('#foodForm')){ t.classList.remove('err'); if(t.name==='servings') t.closest('.stepper').style.borderColor=''; updatePreview(); }
  else if(t.id==='dbSearch'){ dbQueue(t.value); }
  else if(t.id==='customG'){ const g = num(t.value); UI.sheet.grams = g>0 ? g : 0; syncPortionToForm(); }
  else if(t.id==='foodSearch'){ UI.sheet.q = t.value; $('#foodList').innerHTML = foodListHTML(); }
  else if(['hW','hP','hA','hG'].includes(t.id)) updateHelper();
  else if(t.classList && t.classList.contains('err')) t.classList.remove('err');
});
document.addEventListener('change', ev=>{
  if(ev.target.id==='datePick' && ev.target.value){ UI.date = ev.target.value > todayKey() ? todayKey() : ev.target.value; render(); }
  else if(['hP','hA','hG'].includes(ev.target.id)) updateHelper();
  else if(ev.target.id==='portionSel' && UI.sheet && UI.sheet.food){ if($('#foodForm')) UI.sheet.form = readForm(); UI.sheet.portion = +ev.target.value; applyPortion(); renderSheet();
    if(UI.sheet.portion===-2){ const c=$('#customG'); if(c){ c.focus(); c.select(); } } }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape'){ if(scanStop) scanStop(); else if($('#dialogRoot').innerHTML) $('#dialogRoot').innerHTML=''; else if(UI.sheet) closeSheet(); }
  else if(ev.key==='Enter' && ev.target.id==='dbSearch'){ ev.preventDefault(); dbQueue(ev.target.value, true); }
});
window.addEventListener('online', ()=>{ if(UI.sheet && UI.sheet.tab==='search'){ if(UI.sheet.db.status==='offline') UI.sheet.db.status='idle'; paintDb(); } });
window.addEventListener('offline', ()=>{ if(UI.sheet && UI.sheet.tab==='search') paintDb(); });
let rT; window.addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(()=>{ fitTitle(); if(UI.view==='weight') drawWeightChart(); else if(UI.view==='history') renderHistory(); }, 150); });
// Roll over to the new day if the app is left open past midnight
let lastToday = todayKey();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ const t = todayKey(); if(t!==lastToday){ if(UI.date===lastToday) UI.date = t; lastToday = t; render(); } } });
// Keep multiple open tabs in sync
window.addEventListener('storage', e=>{ if(e.key===KEY || e.key===null){ S = load(); render(); } else if(e.key===SKEY) paintAccount(); });
// Cloud sync triggers (all no-ops when sync isn't configured or nobody is signed in)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) scheduleSync(300); else if(ACC.client && dirtyCount(loadMeta())) syncNow(); });
window.addEventListener('online', ()=>{ scheduleSync(500); paintAccount(); });
window.addEventListener('offline', ()=>{ if(ACC.client && loadMeta().uid) setSync('offline'); });
setInterval(()=>{ if(!document.hidden && ACC.client) syncNow(); }, 90000);

/* ---------- service worker (offline app shell; http(s) only) ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && (location.protocol==='https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

render();
initAccount();
})();
</script>
</body>
</html>
