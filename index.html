<style>
:root{
  --bg:#f4f5f8;--card:#fff;--card2:#f7f8fb;--text:#14161b;--muted:#6b7280;--line:#e5e7ee;
  /* nutrient colors: calories amber-orange, protein red, weight green. *-solid = button fills (white text ≥ 4.5:1) */
  --cal:#f08a00;--cal-soft:rgba(240,138,0,.14);--cal-over:#b45309;
  --pro:#d62828;--pro-soft:rgba(214,40,40,.12);--pro-solid:#d62828;--food-solid:#1877F2;
  --wt:#15803d;--wt-soft:rgba(21,128,61,.13);--wt-solid:#15803d;
  /* general UI accent (links, primary buttons, active tab, focus) */
  --accent:#6d5dfc;--accent-soft:rgba(109,93,252,.14);
  --carb:#1b9fe0;--fat:#e9a800;--fib:#1fae6b;
  --good:#16a34a;--bad:#e5484d;--warn:#f59e0b;
  --radius:18px;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --tabh:64px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1015;--card:#171a21;--card2:#1e222b;--text:#eef0f4;--muted:#99a0ad;--line:#282c36;
  --cal:#ffb020;--cal-soft:rgba(255,176,32,.18);--cal-over:#f97316;
  --pro:#ff5a5f;--pro-soft:rgba(255,90,95,.18);--wt:#34c77b;--wt-soft:rgba(52,199,123,.18);
  --accent:#8173ff;--accent-soft:rgba(129,115,255,.2);--shadow:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{font-size:16px}
.hidden{display:none!important}
.app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 90px)}
.topbar{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 2px 12px;gap:6px}
.topbar>div:first-child{min-width:0;max-width:100%}
#topRight:empty{display:none}
.topbar h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:750;white-space:nowrap}
.topbar h1.long{font-size:clamp(19px,7.2vw,28px);letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;margin-bottom:14px}
.datenav .arrow{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.datenav .arrow:active{background:var(--card2)}
.datenav .arrow:disabled{opacity:.25}
.tag.planned{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent)}
.tag.locked{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.ringbox.ro{cursor:default}
.plannote{text-align:center;font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.ringbox.off{cursor:default}.ringbox.off .ring,.ringbox.off .lbl{opacity:.55}
.fab:disabled{opacity:.4;filter:grayscale(.6);box-shadow:none;cursor:not-allowed}
.calover{color:var(--cal-over)}
.datelabel{text-align:center;position:relative;flex:1}
.datelabel b{display:block;font-size:16px}
.datelabel span{font-size:12px;color:var(--muted)}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--pro-soft);color:var(--pro);white-space:nowrap}
.hero{padding:16px 10px 14px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ringbox{text-align:center;min-width:0;display:block;width:100%;color:inherit;border-radius:14px}
button.ringbox{padding:0}
button.ringbox:active{background:var(--card2)}
.ringbox .lbl{font-size:11.5px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;white-space:nowrap}
.ring{position:relative;width:100%;max-width:150px;margin:0 auto;aspect-ratio:1}
.ring svg.spark{position:absolute;inset:0;transform:none}
.ring svg.spark circle{fill:var(--muted);fill-opacity:.45;stroke:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--card2)}
.ring .prog{stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:clamp(17px,5.4vw,26px);font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.ring .big .u{font-size:.6em;font-weight:700;letter-spacing:0}
.ring .of{font-size:clamp(10px,2.9vw,11.5px);color:var(--muted);margin-top:3px;white-space:nowrap}
.ring .center.top{justify-content:flex-start;padding-top:27%}
.remain{margin-top:6px;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remain.sub{margin-top:1px;font-size:11px;font-weight:500;color:var(--muted)}
.remain .down{color:var(--good)}.remain .up{color:var(--bad)}
.remain.over{color:var(--cal-over)}
.remain.hit{color:var(--good)}
.secondary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.macro .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.macro .mh b{color:var(--text);font-weight:650}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--text);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;width:100%;text-align:left}
.banner b{color:var(--accent)}
.meal{padding:12px 14px}
.meal-h{display:flex;align-items:center;gap:8px;padding:2px 0 6px}
.meal-h h3{margin:0;font-size:16px;font-weight:700}
.meal-h .tot{font-size:12px;color:var(--muted)}
.addbtn{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:20px;color:var(--accent);font-weight:500}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.meal-h + .entry{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .nm span{font-size:12px;color:var(--muted)}
.entry .kc{text-align:right;font-size:14px;font-weight:650;white-space:nowrap}
.entry .kc span{display:block;font-size:12px;color:var(--pro);font-weight:650}
.empty{font-size:13px;color:var(--muted);padding:6px 0 4px}
.linkbtn{color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}
.fabs{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);z-index:20;display:flex;justify-content:center;gap:10px;padding:0 12px;pointer-events:none}
.fab{pointer-events:auto;background:var(--food-solid);color:#fff;font-weight:700;padding:14px 20px;min-height:50px;border-radius:99px;box-shadow:0 8px 22px color-mix(in srgb,var(--food-solid) 40%,transparent);display:flex;gap:7px;align-items:center;justify-content:center;font-size:15px;white-space:nowrap}
.fab:active{transform:scale(.97)}
#fabW{background:var(--wt-solid);box-shadow:0 8px 22px color-mix(in srgb,var(--wt-solid) 40%,transparent)}
#fabX{background:#111;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.fab .pl{font-size:20px;line-height:1}.fab .sm{display:none}
@media (max-width:419px){.fab .lg{display:none}.fab .sm{display:inline}.fabs{gap:8px}}
@media (prefers-color-scheme:dark){#fabX{border:1px solid rgba(255,255,255,.4);box-shadow:none}}
@media (max-width:360px){.fab{padding:13px 14px;font-size:14px;gap:5px}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);outline:none;transition:border-color .15s;min-height:44px}
.inp:focus{border-color:var(--accent)}
.inp.req{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.inp.err{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:650;background:var(--card2);min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:rgba(229,72,77,.12);color:var(--bad)}
.btn.block{width:100%}
.btn:active{opacity:.85}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{padding:7px 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card2);overflow:hidden}
.stepper button{width:44px;height:44px;font-size:20px;color:var(--accent);font-weight:600}
.stepper input{flex:1;min-width:0;text-align:center;border:0;background:transparent;padding:10px 0;outline:none;font-weight:650}
.preview{display:flex;gap:10px;flex-wrap:wrap;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.preview b{font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:600px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sheet .sh{display:flex;align-items:center;padding:8px 16px 10px}
.sheet .sh h3{margin:0;font-size:18px;flex:1}
.sheet .x{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px;color:var(--muted)}
.sheet .sb{overflow-y:auto;padding:0 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sect + .food,.food:first-child{border-top:0}
.food .fb{flex:1;min-width:0;text-align:left}
.food .fb > b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .fb > span{font-size:12px;color:var(--muted)}
.qadd{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;display:grid;place-items:center;flex:none;transition:background .2s}
.qadd.done{background:var(--good)}
.trash{width:34px;height:34px;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.trash svg,.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .d{font-size:12px;color:var(--muted)}
.down{color:var(--good)}.up{color:var(--bad)}
.chart{width:100%;position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:10.5px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list .wrow{width:100%;text-align:left;min-height:52px}.wrow .chev{color:var(--muted);font-size:20px;margin-left:4px}
.list .li:first-child{border-top:0}
.dayrow{width:100%;text-align:left}
.ok{color:var(--good);font-weight:700}
.no{color:var(--muted)}
.big-streak{display:flex;align-items:center;gap:14px}
.streakcard .sk-top{display:flex;align-items:center;gap:16px}
.sk-ring{--pct:0%;width:92px;height:92px;flex:none;border-radius:50%;padding:7px;background:conic-gradient(from -90deg,#f08a00,#d62828 var(--pct),var(--card2) var(--pct))}
.sk-in{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sk-fl{font-size:18px}.sk-n{font-size:34px;font-weight:850;letter-spacing:-.04em;color:var(--text)}
.sk-h{font-size:18px;font-weight:750;display:block;margin-bottom:2px}
.sk-best{margin-top:8px;font-size:13px;font-weight:600;display:inline-block;background:var(--cal-soft);padding:4px 10px;border-radius:99px}
.sk-days{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:14px}
.sk-d{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
.sk-d i{display:block;width:100%;max-width:18px;aspect-ratio:1;border-radius:50%;background:var(--card2)}
.sk-d.on i{background:linear-gradient(135deg,#f08a00,#d62828)}
.sk-d.today i{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--cal)}.sk-d.today span{color:var(--text);font-weight:700}
.sk-msg{margin-top:10px;font-size:13px;color:var(--muted)}
details.wlist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.wlist summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--accent);list-style:none}
details.wlist summary::-webkit-details-marker{display:none}
details.wlist summary::after{content:" ›";display:inline-block;transition:transform .2s}details.wlist[open] summary::after{transform:rotate(90deg)}
details.wlist summary small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.pavg{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pavg-n{font-size:36px;font-weight:850;letter-spacing:-.03em;line-height:1}.pavg-n small{font-size:15px;font-weight:700;margin-left:2px}
.mday{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.mday-h{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.mday-v{display:flex;flex-wrap:wrap;gap:4px 14px}.mday-v b{font-size:16px}
.xrow{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 2px;border-top:1px solid var(--line);gap:2px}
.xrow b{font-weight:650;font-size:15px}.xrow span{font-size:12.5px;color:var(--muted)}
.tag.custom{background:var(--card2);color:var(--muted)}
.xdetail{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:12px}.xdetail > b{font-size:16px}
.exentry .kc .burn{color:var(--cal)}
.remain.burned{color:var(--cal);font-weight:650}
.card.subtle{box-shadow:none;background:color-mix(in srgb,var(--card) 70%,transparent)}
.card.subtle h2{font-size:15px;color:var(--muted)}
.big-streak .n{font-size:44px;font-weight:850;letter-spacing:-.04em;color:var(--pro);line-height:1}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 76px);transform:translate(-50%,20px);opacity:0;z-index:100;
  background:#1b1e25;color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);
  transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#a99fff;font-weight:700}

<script>
(function(){
'use strict';
/* ---------- constants & utils ---------- */
const KEY = 'fuel.nutrition.v1';
const LB_PER_KG = 2.20462262;
const MEALS = [
  {id:'breakfast', label:'Breakfast'},
  {id:'lunch', label:'Lunch'},
  {id:'dinner', label:'Dinner'}
];
const MEAL_LABEL = Object.fromEntries(MEALS.map(m=>[m.id,m.label]));
/* Snacks are no longer a meal. Any entry without a valid meal (old "snack" entries: local, synced, or in an imported
   backup) gets one from the local time it was logged: before 11:00 breakfast, before 16:00 lunch, otherwise dinner. */
const mealFor = ts => { const d = new Date(+ts || Date.now()), h = d.getHours() + d.getMinutes()/60; return h<11 ? 'breakfast' : h<16 ? 'lunch' : 'dinner'; };
const fixMeal = (meal, ts) => MEAL_LABEL[meal] ? meal : mealFor(ts);
let mealFixes = 0;   // entries re-mapped by normalize() (a snack migration is pending a save)
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Record ids are UUIDs so they can sync. Older ids (and weigh-in dates) map to a deterministic UUID, so the same
   record gets the same id on every device and in every re-imported backup. */
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
function cyrb128(str){ let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0,k;i<str.length;i++){ k=str.charCodeAt(i); h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233); h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179); }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233); h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  h1^=(h2^h3^h4); h2^=h1; h3^=h1; h4^=h1; return [h1>>>0,h2>>>0,h3>>>0,h4>>>0]; }
const hex32 = a => a.map(x=>x.toString(16).padStart(8,'0')).join('');
const fmtUUID = h => `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20,32)}`;
function uid(){
  try { if(crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6]&15|64; b[8] = b[8]&63|128;
  return fmtUUID(Array.from(b, x=>x.toString(16).padStart(2,'0')).join(''));
}
const stableUUID = s => { const h = hex32(cyrb128('fuel:'+s)); return fmtUUID(h.slice(0,12)+'8'+h.slice(13,16)+(8|parseInt(h[16],16)&3).toString(16)+h.slice(17,32)); };
function normId(v, seen, salt){
  let s = String(v==null?'':v).trim(); const l = s.toLowerCase();
  let id = UUID_RE.test(l) ? l : (s ? stableUUID(s) : uid());
  if(seen){ if(seen.has(id)) id = stableUUID(id+'|'+salt); seen.add(id); }
  return id;
}
const weightId = date => stableUUID('weight:'+date);
const num = v => { if(v==null) return NaN; return parseFloat(String(v).replace(',','.')); };
const nz = v => { const n = num(v); return isFinite(n) && n>0 ? n : 0; };
const r0 = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;
const fmtN = n => r0(n).toLocaleString();
const fmtG = n => String(Math.abs(n) < 10 ? r1(n) : r0(n));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseKey(b)-parseKey(a))/86400000);
const fmtDate = (k,opts) => parseKey(k).toLocaleDateString(undefined, opts||{weekday:'short',month:'short',day:'numeric'});
const ICON = {
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>'
};

/* ---------- state ---------- */
function defaults(){
  return {version:1, settings:{unit:'lb', goals:{calories:2000, protein:150, carbs:null, fat:null, fiber:null}, goalsSet:false, usdaKey:'', goalWeight:null, goalWeightStart:null, profile:normProfile(), eatBack:true}, entries:{}, foods:[], weights:[], exercise:{}};
}
function normalize(d){
  const s = defaults();
  if(!d || typeof d!=='object') return s;
  if(d.settings && typeof d.settings==='object'){
    s.settings.unit = d.settings.unit==='kg' ? 'kg' : 'lb';
    s.settings.goalsSet = !!d.settings.goalsSet;
    s.settings.usdaKey = typeof d.settings.usdaKey==='string' ? d.settings.usdaKey.trim().slice(0,100) : '';
    const g = d.settings.goals||{};
    s.settings.goals.calories = nz(g.calories) || s.settings.goals.calories;
    s.settings.goals.protein = nz(g.protein) || s.settings.goals.protein;
    ['carbs','fat','fiber'].forEach(k=>{ s.settings.goals[k] = nz(g[k]) || null; });
    const kgOk = v => { v = nz(v); return v>0 && v<1000 ? v : null; };
    s.settings.goalWeight = kgOk(d.settings.goalWeight); s.settings.goalWeightStart = s.settings.goalWeight ? kgOk(d.settings.goalWeightStart) : null;
    s.settings.profile = normProfile(d.settings.profile);
    s.settings.eatBack = d.settings.eatBack !== false;
  }
  const seen = new Set();
  if(d.entries && typeof d.entries==='object'){
    for(const k of Object.keys(d.entries)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(d.entries[k])) continue;
      const list = d.entries[k].filter(e=>e && typeof e==='object').map((e,i)=>{ const ts = +e.ts||Date.now(); if(!MEAL_LABEL[e.meal]) mealFixes++;
        return {id: normId(e.id, seen, k+'|'+i), name: String(e.name||'Food').slice(0,120), meal: fixMeal(e.meal, ts),
        servings: nz(e.servings)||1, cal:nz(e.cal), p:nz(e.p), c:nz(e.c), f:nz(e.f), fib:nz(e.fib), ts, ...servOf(e)}; });
      if(list.length) s.entries[k] = list;
    }
  }
  if(d.exercise && typeof d.exercise==='object'){
    for(const k of Object.keys(d.exercise)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(d.exercise[k])) continue;
      const list = d.exercise[k].filter(x=>x && typeof x==='object' && (x.name || x.code)).map((x,i)=>normExercise(x, normId(x.id, seen, 'ex|'+k+'|'+i)));
      if(list.length) s.exercise[k] = list;
    }
  }
  if(Array.isArray(d.foods)) s.foods = d.foods.filter(f=>f&&f.name).map((f,i)=>({id:normId(f.id, seen, 'food|'+i), name:String(f.name).slice(0,120), cal:nz(f.cal), p:nz(f.p), c:nz(f.c), f:nz(f.f), fib:nz(f.fib), servings:nz(f.servings)||1, ...servOf(f)}));
  if(Array.isArray(d.weights)){ const byDate = new Map(); d.weights.filter(w=>w && /^\d{4}-\d{2}-\d{2}$/.test(w.date) && nz(w.kg)).forEach(w=>byDate.set(w.date, {date:w.date, kg:nz(w.kg)}));
    s.weights = Array.from(byDate.values()).sort((a,b)=>a.date<b.date?-1:1); }
  return s;
}
/* goal-helper profile (sex, age, height, activity, aim, protein per lb); remembered locally and synced with the profile */
const ACTIVITY = [[1.2,'Sedentary','desk job, little or no exercise'],[1.375,'Lightly active','light exercise or long walks 1–3 days a week'],
  [1.55,'Moderately active','moderate exercise 3–5 days a week'],[1.725,'Very active','hard exercise 6–7 days a week, or a physical job']];
const AIMS = [[-500,'Lose ~1 lb (0.45 kg) a week','−500 kcal'],[-250,'Lose ~½ lb (0.2 kg) a week','−250 kcal'],[0,'Maintain weight','±0'],[250,'Gain slowly (lean gain)','+250 kcal']];
const PER_LB = [0.7, 0.8, 0.9, 1];
function normProfile(p){
  p = p && typeof p==='object' ? p : {}; const rng = (v,lo,hi) => { v = num(v); return v>=lo && v<=hi ? v : null; };
  const age = rng(p.age,13,110), h = rng(p.heightCm,90,250);
  return {sex: p.sex==='m'||p.sex==='f' ? p.sex : '', age: age ? Math.round(age) : null, heightCm: h ? Math.round(h*10)/10 : null,
    activity: ACTIVITY.some(a=>a[0]===+p.activity) ? +p.activity : 1.2, aim: AIMS.some(a=>a[0]===+p.aim) && p.aim!==null && p.aim!=='' ? +p.aim : null,
    perLb: PER_LB.includes(+p.perLb) ? +p.perLb : 0.8};
}
/* 2024 Adult Compendium of Physical Activities (Herrmann SD, et al. J Sport Health Sci 2024;13:6–12; pacompendium.com):
   a curated set of common activities — [Compendium code, MET, name, category, official description]. */
const ACTIVITIES = [
  ["17152", 2.8, "Walking, slow (2–2.4 mph)", "Walking", "Walking, 2.0 to 2.4 mph, level, slow pace, firm surface"],
  ["17190", 3.8, "Walking, moderate (2.8–3.4 mph)", "Walking", "Walking, 2.8 to 3.4 mph, level, moderate pace, firm surface"],
  ["17200", 4.8, "Walking, brisk (3.5–3.9 mph)", "Walking", "Walking, 3.5 to 3.9 mph, level, brisk, firm surface, walking for exercise"],
  ["17220", 5.5, "Walking, very brisk (4–4.4 mph)", "Walking", "Walking, 4.0 to 4.4 mph (6.4 to 7.0 km/h), level, firm surface, very brisk pace"],
  ["17230", 7.0, "Walking, very fast (4.5–4.9 mph)", "Walking", "Walking, 4.5 to 4.9 mph, level, firm surface, very, very brisk"],
  ["17165", 3.0, "Walking the dog", "Walking", "Walking the dog"],
  ["17100", 3.8, "Walking with a stroller or kids", "Walking", "Pushing or pulling stroller with child or walking with children, 2.5 to 3.1 mph"],
  ["17355", 3.8, "Treadmill walking, 3–3.4 mph", "Walking", "Walking, treadmill, 3.0 to 3.4 mph (4.8 to 5.5 km/h), 0% grade"],

function normExercise(x, id){
  const met = +x.met, min = +x.min, kcal = +x.kcal, code = /^\d{5}$/.test(x.code||'') ? x.code : null;
  return {id, name:String(x.name || (code && ACT_BY_CODE[code] ? ACT_BY_CODE[code].name : 'Exercise')).slice(0,120), code, met: code && met>0 && met<30 ? met : null,
    min: min>0 && min<=1440 ? Math.round(min*10)/10 : null, kcal: kcal>=0 && kcal<20000 ? Math.round(kcal) : 0, ts: +x.ts || Date.now()};
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }

  if(typeof trackChanges==='function') trackChanges();   // cloud sync change tracker (no-op when sync isn't configured)
}

/* ---------- calculations ---------- */
function entryTotals(e){ const s = e.servings||1; return {cal:e.cal*s, p:e.p*s, c:e.c*s, f:e.f*s, fib:e.fib*s}; }
function sumEntries(list){
  const t = {cal:0,p:0,c:0,f:0,fib:0,n:0};
  (list||[]).forEach(e=>{ const x = entryTotals(e); t.cal+=x.cal; t.p+=x.p; t.c+=x.c; t.f+=x.f; t.fib+=x.fib; t.n++; });
  return t;
}
const dayTotals = k => sumEntries(S.entries[k]);
/* Planning ahead: the day navigator goes exactly one day past today. Tomorrow's entries are "planned": they never count
   toward streaks, history averages or days hit until that day arrives (all of those only look at days <= today). */
const tomorrowKey = () => addDays(todayKey(), 1);
const isPlanned = k => k > todayKey();
/* Once a day has passed (local time) it is read-only. Food: today + tomorrow (planning). Weight: today only.
   Every user write goes through the functions below, which enforce this; applying synced changes from other devices,
   import and reset write S directly and are not affected. */
const isPast = k => k < todayKey();
const canFood = k => !!k && k >= todayKey() && k <= tomorrowKey();
const canWeight = k => k === todayKey();
function lockedMsg(k, what){ return isPast(k) ? 'Past days are locked' : (what==='weight' ? 'Weight can only be logged for today' : 'You can only plan one day ahead'); }
function denyFood(k){ if(canFood(k)) return false; toast(lockedMsg(k,'food')); return true; }
/* Exercise: today only (past days locked, nothing in the future). Calories = MET × body weight (kg) × hours — gross METs,
   as the Compendium lists them (includes the ~1 MET you'd burn at rest anyway). */
const canExercise = k => k === todayKey();
function denyExercise(k){ if(canExercise(k)) return false; toast(isPast(k) ? 'Past days are locked' : 'Exercise can only be logged for today'); return true; }
const metKcal = (met, kg, min) => Math.round(met * kg * min / 60);
const burnedOn = k => (S.exercise[k]||[]).reduce((a,x)=>a+x.kcal, 0);
const calBudget = k => G().calories + (S.settings.eatBack!==false ? burnedOn(k) : 0);
function logExercise(k, data){
  if(denyExercise(k)) return null;
  const x = normExercise({...data, ts:Date.now()}, uid()); (S.exercise[k] = S.exercise[k]||[]).push(x); save(); return x;
}
function updateExercise(k, id, data){
  if(denyExercise(k)) return false; const l = S.exercise[k]||[], i = l.findIndex(x=>x.id===id); if(i<0) return false;
  l[i] = normExercise({...l[i], ...data}, id); save(); return true;
}
function removeExercise(k, id){
  if(denyExercise(k)) return null; const l = S.exercise[k]||[], i = l.findIndex(x=>x.id===id); if(i<0) return null;
  const [x] = l.splice(i,1); if(!l.length) delete S.exercise[k]; save(); return x;
}
function restoreExercise(k, x){ if(denyExercise(k)) return; const l = S.exercise[k] = S.exercise[k]||[]; if(!l.some(y=>y.id===x.id)) l.push(x); save(); }
function recentExercise(){
  const map = new Map();
  for(const k of Object.keys(S.exercise)) for(const x of S.exercise[k]){
    const key = x.code ? 'c:'+x.code : 'n:'+x.name.trim().toLowerCase(), m = map.get(key);
    if(!m) map.set(key, {key, count:1, x}); else { m.count++; if(x.ts > m.x.ts) m.x = x; }
  }
  return Array.from(map.values()).sort((a,b)=>(b.count>=2)-(a.count>=2) || b.x.ts-a.x.ts);
}
const proteinHit = t => t.n>0 && t.p >= G().protein - 0.5;
const calHit = (t, k) => t.n>0 && t.cal <= (k ? calBudget(k) : G().calories) + 0.5;
/* Streak = logging: consecutive days with at least one food entry. Today doesn't break it while it's in progress,
   and planned (tomorrow) entries never count. */
const loggedOn = k => !isPlanned(k) && (S.entries[k]||[]).length > 0;
function currentStreak(){
  let k = todayKey(), n = 0;
  if(!loggedOn(k)) k = addDays(k,-1);
  while(loggedOn(k)){ n++; k = addDays(k,-1); }
  return n;
}
function bestStreak(){
  const keys = Object.keys(S.entries).filter(loggedOn).sort(); let best = 0, run = 0, prev = null;
  for(const k of keys){ run = prev && diffDays(prev,k)===1 ? run+1 : 1; best = Math.max(best, run); prev = k; }
  return Math.max(best, currentStreak());
}
function recentFoods(){
  const map = new Map();
  for(const k of Object.keys(S.entries)){
    for(const e of S.entries[k]){
      const id = e.name.trim().toLowerCase();
      const m = map.get(id);
      const vals = {name:e.name,cal:e.cal,p:e.p,c:e.c,f:e.f,fib:e.fib,servings:e.servings,ts:e.ts,serv:e.serv||''};
      if(!m) map.set(id,{key:id, count:1, ...vals});
      else { m.count++; if(e.ts>m.ts) Object.assign(m,vals); }
    }
  }
  return Array.from(map.values());
}
const defaultMeal = () => mealFor(Date.now());
const unit = () => S.settings.unit;
const toDisp = kg => unit()==='lb' ? kg*LB_PER_KG : kg;
const toKg = v => unit()==='lb' ? v/LB_PER_KG : v;
const fmtW = kg => r1(toDisp(kg)).toFixed(1);
function withMA(ws){
  return ws.map((w,i)=>{
    let sum=0,n=0;
    for(let j=i;j>=0;j--){ if(diffDays(ws[j].date,w.date)>6) break; sum+=ws[j].kg; n++; }
    return {date:w.date, kg:w.kg, ma:sum/n};
  });
}
function weightChange(days){
  const ws = S.weights; if(ws.length<2) return null;
  const last = ws[ws.length-1]; const target = addDays(last.date,-days);
  let ref=null; for(let i=ws.length-2;i>=0;i--){ if(ws[i].date<=target){ ref=ws[i]; break; } }
  if(!ref) return null;
  return {delta:last.kg-ref.kg, from:ref.date};
}

let toastTimer=null, toastUndoFn=null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg;
  toastUndoFn = undo||null;
  $('#toastUndo').classList.toggle('hidden', !undo);
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('#toast').classList.remove('show'), undo?5000:2400);
}
$('#toastUndo').addEventListener('click',()=>{ if(toastUndoFn){ toastUndoFn(); toastUndoFn=null; } $('#toast').classList.remove('show'); });
function confirmDialog({title, text, ok='Confirm', cancel='Cancel', danger=false}){
  return new Promise(res=>{
    const root = $('#dialogRoot');
    root.innerHTML = `<div class="dialog" role="alertdialog"><div class="box"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="acts"><button class="btn" data-r="0">${esc(cancel)}</button><button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(ok)}</button></div></div></div>`;
    root.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',ev=>{ ev.stopPropagation(); root.innerHTML=''; res(b.dataset.r==='1'); }));
  });
}

/* ---------- Today ---------- */
function ringHTML({kind, label, value, goal, color, burned=0, eatBack=true}){
  if(kind==='cal' && eatBack) goal += burned;          // exercise calories are added back to the day's budget
  const R=52, C=2*Math.PI*R, pct = goal>0 ? value/goal : 0;
  const over = value > goal + 0.5;
  const off = C*(1-Math.min(pct,1));
  let strokeColor = color, remain;
  if(kind==='cal'){
    if(over){ strokeColor='var(--cal-over)'; remain = `<div class="remain over">⚠ ${fmtN(value-goal)} over</div>`; }
    else remain = `<div class="remain">${fmtN(goal-value)} left</div>`;
    if(burned>0) remain += `<div class="remain sub burned" data-burned="${burned}">🔥 ${fmtN(burned)} burned${eatBack?'':' · not added'}</div>`;
  } else {
    if(value >= goal-0.5 && value>0) remain = `<div class="remain hit">✓ Hit${over?` · +${fmtG(value-goal)}g`:''}</div>`;
    else remain = `<div class="remain">${fmtG(goal-value)}g to go</div>`;
  }
  return `<div class="ringbox" data-ring="${kind}">
    <div class="lbl" style="color:${color}">${label}</div>
    <div class="ring"><svg viewBox="0 0 124 124"><circle class="track" cx="62" cy="62" r="${R}"/>
      <circle class="prog" cx="62" cy="62" r="${R}" stroke="${strokeColor}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>
      <div class="center"><div class="big" data-val>${kind==='cal'?fmtN(value):fmtG(value)+'<span class="u">g</span>'}</div><div class="of">of ${kind==='cal'?fmtN(goal):fmtG(goal)+' g'}</div></div>
    </div>${remain}</div>`;
}
/* Weight tile: latest weigh-in on or before the viewed day, 7-day change, and either progress toward the
   optional goal weight or a 30-day sparkline (weigh-ins + 7-day average). Tapping it opens quick weight logging. */
function weightAt(k){ let w = null; for(const x of S.weights){ if(x.date<=k) w = x; else break; } return w; }
function weightChangeAt(k, days){
  const cur = weightAt(k); if(!cur) return null;
  const target = addDays(cur.date, -days); let ref = null;
  for(const x of S.weights){ if(x.date<=target) ref = x; else break; }
  return ref ? {delta:cur.kg-ref.kg, from:ref.date} : null;
}
function goalProgress(cur){
  const g = S.settings.goalWeight; if(!g || !cur) return null;
  const start = S.settings.goalWeightStart || (S.weights[0]||cur).kg;
  if(Math.abs(start-g) < 0.05) return Math.abs(cur.kg-g) < 0.25 ? 1 : 0;
  return Math.max(0, Math.min(1, (start-cur.kg)/(start-g)));
}
function sparkSVG(k){
  const from = addDays(k,-29), pts = withMA(S.weights).filter(p=>p.date>=from && p.date<=k);
  if(!pts.length) return '';
  const x0=30, x1=94, y0=70, y1=92, vals = pts.flatMap(p=>[p.kg,p.ma]);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max(0.3,(hi-lo)*0.12); lo-=pad; hi+=pad;
  const X = d => pts.length===1 ? (x0+x1)/2 : x0 + (x1-x0)*(29-diffDays(d,k))/29, Y = v => y1 - (y1-y0)*(v-lo)/(hi-lo);
  const dots = pts.map(p=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="1.6"/>`).join('');
  const line = pts.length>1 ? `<polyline points="${pts.map(p=>X(p.date).toFixed(1)+','+Y(p.ma).toFixed(1)).join(' ')}" fill="none" stroke="var(--wt)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  return `<svg class="spark" viewBox="0 0 124 124" aria-hidden="true">${dots}${line}</svg>`;
}
function weightTileHTML(k){
  const cur = weightAt(k), u = unit(), gw = S.settings.goalWeight, R = 52, C = 2*Math.PI*R, color = 'var(--wt)';
  const label = `<div class="lbl" style="color:${color}">Weight</div>`;
  if(isPlanned(k)) return `<div class="ringbox off" data-ring="wt" aria-disabled="true" aria-label="Weight can’t be logged for a future day">${label}
    <div class="ring"><svg viewBox="0 0 124 124"><circle class="track" cx="62" cy="62" r="${R}"/></svg>
      <div class="center"><div class="big" data-val style="color:var(--muted)">—</div><div class="of">${u}</div></div></div>
    <div class="remain" style="color:var(--muted);font-weight:500">Log it on the day</div></div>`;
  const ro = !canWeight(k), open = ro ? `<div class="ringbox ro" data-ring="wt" aria-disabled="true"` : `<button class="ringbox" data-ring="wt" data-act="log-weight"`, close = ro ? '</div>' : '</button>';
  if(!cur) return `${open} aria-label="${ro?'No weigh-in':'Log weight'}">${label}
    <div class="ring"><svg viewBox="0 0 124 124"><circle class="track" cx="62" cy="62" r="${R}"/></svg>
      <div class="center"><div class="big" data-val style="color:var(--muted)">—</div><div class="of">${u}</div></div></div>
    ${ro?`<div class="remain" style="color:var(--muted);font-weight:500">No weigh-in</div>`:`<div class="remain" style="color:var(--wt)">+ Log weight</div>`}${close}`;
  const ch = weightChangeAt(k, 7), pr = goalProgress(cur);
  const gaining = gw && gw > cur.kg;
  let chTxt = '<span class="muted" style="font-weight:500">no 7-day change yet</span>';
  if(ch){ const v = r1(toDisp(ch.delta)); const good = gaining ? v>0 : v<0; chTxt = `<span class="${v===0?'':good?'down':'up'}">${v>0?'+':v<0?'−':'±'}${Math.abs(v).toFixed(1)} ${u}</span> <span class="muted" style="font-weight:500">7d</span>`; }
  const ring = pr==null
    ? `<svg viewBox="0 0 124 124"><circle class="track" cx="62" cy="62" r="${R}"/></svg>${sparkSVG(k)}`
    : `<svg viewBox="0 0 124 124"><circle class="track" cx="62" cy="62" r="${R}"/><circle class="prog" cx="62" cy="62" r="${R}" stroke="${color}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-pr)).toFixed(2)}"/></svg>`;
  const sub = pr==null ? u : `goal ${fmtW(gw)}`;
  const when = cur.date===k ? '' : `<div class="remain sub">${esc(cur.date===addDays(k,-1)?'from yesterday':'from '+fmtDate(cur.date,{month:'short',day:'numeric'}))}</div>`;
  return `${open} aria-label="Weight ${fmtW(cur.kg)} ${u}${ro?'':'. Tap to log weight'}">${label}
    <div class="ring" data-mode="${pr==null?'spark':'goal'}">${ring}
      <div class="center${pr==null?' top':''}"><div class="big" data-val>${fmtW(cur.kg)}</div><div class="of">${esc(sub)}</div></div></div>
    <div class="remain" data-change>${chTxt}</div>${when}${close}`;
}
function macroHTML(label, val, goal, color){
  const w = goal ? Math.min(100, val/goal*100) : (val>0?100:0);
  return `<div class="macro"><div class="mh"><span>${label}</span><b>${fmtG(val)}${goal?`<span class="muted" style="font-weight:500">/${fmtG(goal)}</span>`:''}g</b></div>
    <div class="bar"><i style="width:${w}%;background:${color};${goal?'':'opacity:.35'}"></i></div></div>`;
}

function copyEntries(src){
  const k = UI.date; const now = Date.now();
  if(!src.length || denyFood(k)) return;
  const copies = src.map((e,i)=>({...e, id:uid(), ts:now+i}));
  S.entries[k] = (S.entries[k]||[]).concat(copies);
  save(); render();
  const ids = new Set(copies.map(c=>c.id));
  toast(`Copied ${copies.length} item${copies.length>1?'s':''}`, ()=>{ if(denyFood(k)) return; S.entries[k]=(S.entries[k]||[]).filter(e=>!ids.has(e.id)); if(!S.entries[k].length) delete S.entries[k]; save(); render(); });
}

function barChartHTML(days, valFn, goal, opts){
  const W = Math.max(260, ($('#view').clientWidth||360) - 32), H = opts.h || 170, padL = 34, padB = 22, padT = 16;
  const vals = days.map(valFn);
  const raw = Math.max(goal*1.15, ...vals, 1);
  const step = [5,10,20,25,50,100,200,250,500,1000,2000].find(s=>raw/s<=4) || 5000;
  const max = Math.ceil(raw/step)*step;
  const y = v => padT + (H-padT-padB)*(1 - v/max);
  const n = days.length, slot = (W-padL)/n, bw = Math.min(22, slot*0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label)}">`;
  const ticks=[]; for(let t=0;t<=max+1e-9;t+=step) ticks.push(t);
  ticks.forEach(t=>{ s += `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(t)+3.5}" text-anchor="end">${t>=1000?(t/1000).toFixed(t%1000?1:0)+'k':Math.round(t)}</text>`; });
  days.forEach((k,i)=>{
    const v = vals[i], x = padL + slot*i + (slot-bw)/2, yy = y(v);
    s += `<g data-act="goto-day" data-k="${k}" style="cursor:pointer"><rect x="${padL+slot*i}" y="${padT}" width="${slot}" height="${H-padT-padB}" fill="transparent"/>`;
    if(v>0) s += `<rect class="bar-v" x="${x}" y="${yy}" width="${bw}" height="${Math.max(2,H-padB-yy)}" rx="${Math.min(5,bw/3)}" fill="${opts.color(opts.hit(k))}"/>`;
    else s += `<rect x="${x}" y="${H-padB-2}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`;
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" ${k===todayKey()?'style="fill:var(--text);font-weight:700"':''}>${parseKey(k).getDate()}</text></g>`;
  });
  s += `<line x1="${padL}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="${opts.goalColor}" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W}" y="${y(goal)-5}" text-anchor="end" style="fill:${opts.goalColor};font-weight:700">Goal ${fmtN(goal)}${opts.suffix||''}</text></svg>`;
  return s;
}

class HttpError extends Error { constructor(status, code){ super('HTTP '+status); this.status = status; this.code = code; } }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function fetchJSON(url, {timeout=12000, signal}={}){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeout);
  const onAbort = ()=>ctrl.abort();
  if(signal){ if(signal.aborted) ctrl.abort(); else signal.addEventListener('abort', onAbort, {once:true}); }
  try{
    const res = await fetch(url, {signal: ctrl.signal, credentials:'omit'});
    let body = null; try { body = await res.json(); } catch(e){}
    if(!res.ok) throw new HttpError(res.status, body && body.error && body.error.code);
    return body;
  } catch(e){
    if(e instanceof HttpError) throw e;
    const x = new Error(e && e.message || 'network');
    if(signal && signal.aborted) x.cancelled = true; else if(ctrl.signal.aborted) x.timeout = true; else x.network = true;
    throw x;
  } finally { clearTimeout(timer); if(signal) signal.removeEventListener('abort', onAbort); }
}

/* --- normalizers: every food becomes {per100:{cal,p,c,f,fib}, basis:'g'|'ml', portions:[{label, grams, exact?}]} --- */
const titleIfCaps = s => { s = String(s||'').trim(); return (s && s===s.toUpperCase() && /[A-Z]/.test(s)) ? s.toLowerCase().replace(/(^|[\s(\-\/&,.])([a-z])/g,(m,a,b)=>a+b.toUpperCase()) : s; };
const capFirst = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
function usdaNut(f, id){ const n = (f.foodNutrients||[]).find(x=>x.nutrientId===id && typeof x.value==='number'); return n ? {v:n.value, unit:String(n.unitName||'').toUpperCase()} : null; }
function usdaEnergy(f){
  for(const id of [1008, 2047, 2048]){ const e = usdaNut(f,id); if(e) return e.unit==='KJ' ? e.v/4.184 : e.v; } // 1008 = Energy (kcal); 2047/2048 = Atwater general/specific
  const kj = usdaNut(f,1062); return kj ? kj.v/4.184 : null;
}
function fromUSDA(f){
  if(!f) return null;
  const cal = usdaEnergy(f); if(cal==null) return null;
  const g = (...ids) => { for(const id of ids){ const n = usdaNut(f,id); if(n) return n.v; } return 0; };
  const per100 = {cal, p:g(1003), c:g(1005,1050), f:g(1004,1085), fib:g(1079,2033)};
  const unitRaw = String(f.servingSizeUnit||'g').toLowerCase();
  const basis = /^(ml|mlt|milliliter)/.test(unitRaw) ? 'ml' : 'g';
  const portions = [], seen = new Set();
  const add = p => { const k = p.label.toLowerCase(); if(!seen.has(k)){ seen.add(k); portions.push(p); } };
  if(f.dataType==='Branded' && +f.servingSize>0 && /^(g|grm|gram|ml|mlt|milliliter)/.test(unitRaw)){
    const ss = +f.servingSize, hh = String(f.householdServingFullText||'').trim().toLowerCase();
    const p = {label:`${hh||'1 serving'} (${r1(ss)} ${basis})`, grams:ss};
    const L = f.labelNutrients; // present on the /food/{id} details endpoint; used verbatim when available
    if(L && L.calories && typeof L.calories.value==='number') p.exact = {cal:L.calories.value, p:(L.protein||{}).value||0, c:(L.carbohydrates||{}).value||0, f:(L.fat||{}).value||0, fib:(L.fiber||{}).value||0};
    add(p);
  }
  (f.foodMeasures||[]).slice().sort((a,b)=>(a.rank||99)-(b.rank||99)).forEach(m=>{
    const gw = +m.gramWeight; let t = String(m.disseminationText||'').trim();
    if(!(gw>0) || !t) return;
    if(/^quantity not specified$/i.test(t)) t = 'typical portion';
    add({label:`${t} (${r1(gw)} g)`, grams:gw});
  });
  return {src:'usda', id:'usda:'+f.fdcId, name:capFirst(titleIfCaps(f.description||'Food')), brand:titleIfCaps(f.brandName||f.brandOwner||''),
    dataType:f.dataType||'USDA', basis, per100, portions:portions.slice(0,12), barcode:String(f.gtinUpc||'')};
}
function fromOFF(p){
  if(!p) return null;
  const n = p.nutriments||{};
  const v = k => { const x = typeof n[k]==='string' ? parseFloat(n[k]) : n[k]; return typeof x==='number' && isFinite(x) ? x : null; };
  let cal = v('energy-kcal_100g');
  if(cal==null){ const kj = v('energy-kj_100g') ?? v('energy_100g'); if(kj!=null) cal = kj/4.184; } // energy_100g is kJ
  const pr = v('proteins_100g'), cb = v('carbohydrates_100g'), ft = v('fat_100g');
  if(cal==null && pr!=null && cb!=null && ft!=null) cal = pr*4 + cb*4 + ft*9;
  const name = String(p.product_name_en || p.product_name || p.generic_name || '').trim();
  if(cal==null || !name) return null;
  const basis = String(p.serving_quantity_unit||'').toLowerCase()==='ml' ? 'ml' : 'g';
  const portions = [];
  const sq = parseFloat(p.serving_quantity);
  if(sq>0){
    const ss = String(p.serving_size||'').trim();
    const label = !ss ? `1 serving (${r1(sq)} ${basis})` : /^\d+([.,]\d+)?\s*(g|ml)$/i.test(ss) ? `1 serving (${ss})` : /\d\s*(g|ml)\b/i.test(ss) ? ss : `${ss} (${r1(sq)} ${basis})`;
    portions.push({label, grams:sq});
  }
  let pq = parseFloat(p.product_quantity), pqu = String(p.product_quantity_unit||'g').toLowerCase()==='ml' ? 'ml' : 'g';
  if(!(pq>0)){ const m = String(p.quantity||'').match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i); if(m){ pq = parseFloat(m[1].replace(',','.')); pqu = m[2].toLowerCase(); } }
  if(pq>0 && pq<=3000 && !(sq>0 && Math.abs(pq-sq)<1)) portions.push({label:`whole package (${r1(pq)} ${pqu})`, grams:pq, pkg:true});
  let brand = Array.isArray(p.brands) ? p.brands[0] : String(p.brands||'').split(',')[0];
  brand = String(brand||'').trim(); if(brand && brand===brand.toLowerCase()) brand = brand.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  return {src:'off', id:'off:'+p.code, name:capFirst(name), brand:titleIfCaps(brand), dataType:'Open Food Facts', basis,
    per100:{cal, p:pr||0, c:cb||0, f:ft||0, fib:v('fiber_100g')||0}, portions, barcode:String(p.code||''), us:(p.countries_tags||[]).includes('en:united-states')};
}

/* --- searching --- */
async function searchUSDA(q, signal){
  const key = usdaKey();
  // DEMO_KEY is heavily rate-limited, so only generic foods are queried with it (Open Food Facts covers brands).
  const reqs = [{types:USDA_GENERIC, size:20}];
  if(key!=='DEMO_KEY') reqs.push({types:['Branded'], size:15});
  const settled = await Promise.allSettled(reqs.map(r=>fetchJSON(`${USDA_SEARCH}?api_key=${uenc(key)}&query=${uenc(q)}&pageSize=${r.size}&dataType=${uenc(r.types.join(','))}`, {signal})));
  const ok = settled.filter(s=>s.status==='fulfilled');
  if(!ok.length) throw settled[0].reason;
  return ok.flatMap(s=>(s.value && s.value.foods)||[]).map(fromUSDA).filter(Boolean);
}
async function searchOFF(q, signal){
  let last;
  for(let i=0;i<OFF_SEARCH_HOSTS.length;i++){
    if(i) await sleep(700);
    if(signal && signal.aborted){ const x = new Error('cancelled'); x.cancelled = true; throw x; }
    try{
      const d = await fetchJSON(`${OFF_SEARCH_HOSTS[i]}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`, {signal, timeout:10000});
      return ((d && d.products)||[]).map(fromOFF).filter(Boolean);
    } catch(e){ if(e.cancelled) throw e; last = e; if(e.status && e.status<500 && e.status!==429) break; }
  }
  throw last;
}
const normTxt = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function rankMerge(q, lists){
  const toks = normTxt(q).split(' ').filter(Boolean);
  const seen = new Set(), out = [];
  lists.flat().forEach((f,idx)=>{
    const bc = f.barcode.replace(/\D/g,'').replace(/^0+/,'');
    const kName = 'n:'+normTxt(f.brand+' '+f.name)+'|'+Math.round(f.per100.cal/5);
    if((bc && seen.has('b:'+bc)) || seen.has(kName)) return; // de-duplicate across sources (same barcode, or same brand+name+energy)
    if(bc) seen.add('b:'+bc); seen.add(kName);
    const name = normTxt(f.name), words = name.split(' ');
    let s = toks.length ? toks.filter(t=>words.some(w=>w.startsWith(t))).length/toks.length : 0;
    if(toks[0] && name.startsWith(toks[0])) s += .15;
    s += ({'Foundation':.35,'SR Legacy':.3,'Survey (FNDDS)':.3}[f.dataType]||0);
    s -= Math.min(.25, name.length/400);
    if(f.us) s += .12; // Steven is in the US: prefer products sold there
    out.push({f, s, idx});
  });
  return out.sort((a,b)=>b.s-a.s || a.idx-b.idx).map(x=>x.f);
}
let dbTimer = null, dbCtrl = null;
function dbQueue(q, now){
  const st = UI.sheet; if(!st) return;
  clearTimeout(dbTimer); st.db.q = q;
  const t = q.trim();
  if(t.length<2){ if(dbCtrl) dbCtrl.abort(); st.db.status='idle'; st.db.results=[]; st.db.errs={}; paintDb(); return; }
  dbTimer = setTimeout(()=>dbRun(t), now ? 0 : 650);
}
async function dbRun(q){
  const st = UI.sheet; if(!st) return;
  if(/^\d{8,14}$/.test(q)) return barcodeLookup(q);
  if(dbCtrl) dbCtrl.abort();
  const ctrl = dbCtrl = new AbortController();
  if(!navigator.onLine){ st.db.status='offline'; paintDb(); return; }
  const ck = usdaKey()+'|'+q.toLowerCase();
  if(dbCache.has(ck)){ Object.assign(st.db, {status:'done', results:dbCache.get(ck), errs:{}}); paintDb(); return; }
  st.db.status='loading'; st.db.msg='Searching USDA and Open Food Facts…'; st.db.errs={}; paintDb();
  const [u,o] = await Promise.allSettled([searchUSDA(q, ctrl.signal), searchOFF(q, ctrl.signal)]);
  if(ctrl.signal.aborted || UI.sheet!==st || st.db.q.trim()!==q) return;
  const errs = {}; if(u.status==='rejected') errs.usda = u.reason; if(o.status==='rejected') errs.off = o.reason;
  st.db.results = rankMerge(q, [u.value||[], o.value||[]]);
  st.db.errs = errs;
  const bothNet = errs.usda && errs.off && errs.usda.network && errs.off.network;
  st.db.status = bothNet && !navigator.onLine ? 'offline' : 'done';
  if(!errs.usda && !errs.off) dbCache.set(ck, st.db.results);
  paintDb();

async function barcodeLookup(raw, format){

// Copy the part of the video under the aiming box (with some margin) to a canvas; every few frames use the whole frame.
function grabFrame(video, aim, canvas, ctx, full){
  const vw = video.videoWidth, vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if(!full && aim){
    const vr = video.getBoundingClientRect(), ar = aim.getBoundingClientRect();
    const scale = Math.max(vr.width/vw, vr.height/vh); // object-fit: cover
    const ox = (vr.width - vw*scale)/2, oy = (vr.height - vh*scale)/2;
    const mx = ar.width*0.15, my = ar.height*0.4;
    sx = Math.max(0, (ar.left - mx - vr.left - ox)/scale); sy = Math.max(0, (ar.top - my - vr.top - oy)/scale);
    sw = Math.min(vw - sx, (ar.width + 2*mx)/scale); sh = Math.min(vh - sy, (ar.height + 2*my)/scale);
    if(!(sw>40 && sh>40)){ sx = 0; sy = 0; sw = vw; sh = vh; }
  }
  const k = Math.min(1, 1280/sw), cw = Math.max(1, Math.round(sw*k)), ch = Math.max(1, Math.round(sh*k));
  if(canvas.width!==cw) canvas.width = cw;
  if(canvas.height!==ch) canvas.height = ch;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);

}

          const r = await eng.det.detect(video);
          const b = r.find(x=>/^\d{6,14}$/.test(String(x.rawValue||'')));
          if(b) hit = {text:String(b.rawValue), format:b.format};
        } else {
          const img = grabFrame(video, aim, canvas, ctx, (n++ % 3)===2);
          const r = await eng.Z.readBarcodes(img, {formats:ZX_FORMATS, tryHarder:true, maxNumberOfSymbols:1});
          const b = r.find(x=>x.isValid && /^\d{6,14}$/.test(x.text));
          if(b) hit = {text:b.text, format:b.format};
        }
      }
    } catch(e){}
    if(stopped) return;
    if(hit){
      stop();
      window.dispatchEvent(new CustomEvent('fuel:scan', {detail:{text:hit.text, format:hit.format, engine:eng.engine}}));
      if(navigator.vibrate) navigator.vibrate(60);
      const bi = $('#barcodeInp'); if(bi) bi.value = hit.text;
      barcodeLookup(hit.text, hit.format);
      return;
    }
    timer = setTimeout(tick, eng.engine==='native' ? 150 : 80);
  };
  tick();
}

function drawWeightChart(){
  const el = $('#wChart'); if(!el) return;
  const all = withMA(S.weights);
  if(!all.length){ el.innerHTML = `<div class="empty" style="padding:40px 0;text-align:center">Your weight trend will appear here.</div>`; return; }
  const lastDate = all[all.length-1].date;
  const span = {'1m':30,'3m':91,'1y':365,'all':1e6}[UI.wRange];
  const data = all.filter(p=>diffDays(p.date,lastDate) < span);
  const W = Math.max(260, el.clientWidth||320), H = 210, padL = 38, padR = 10, padT = 12, padB = 24;
  const x0 = data[0].date, xSpan = Math.max(1, diffDays(x0,lastDate));
  const vals = data.flatMap(p=>[toDisp(p.kg),toDisp(p.ma)]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const rng = Math.max(hi-lo, unit()==='lb'?2:1); const mid=(hi+lo)/2; lo = mid-rng*0.62; hi = mid+rng*0.62;
  const X = k => data.length===1 ? padL+(W-padL-padR)/2 : padL + (W-padL-padR)*diffDays(x0,k)/xSpan;
  const Y = v => padT + (H-padT-padB)*(1-(v-lo)/(hi-lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Weight chart with 7-day moving average">`;
  for(let i=0;i<=3;i++){ const v = lo+(hi-lo)*i/3; s += `<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL-6}" y="${Y(v)+3.5}" text-anchor="end">${v.toFixed(rng<6?1:0)}</text>`; }
  const lbls = data.length===1 ? [data[0].date] : [x0, addDays(x0, Math.round(xSpan/2)), lastDate];
  lbls.forEach((k,i)=>{ s += `<text x="${X(k)}" y="${H-6}" text-anchor="${data.length===1?'middle':['start','middle','end'][i]}">${esc(fmtDate(k,{month:'short',day:'numeric'}))}</text>`; });
  if(data.length>1){
    s += `<polyline points="${data.map(p=>X(p.date).toFixed(1)+','+Y(toDisp(p.kg)).toFixed(1)).join(' ')}" fill="none" stroke="var(--muted)" stroke-opacity=".3" stroke-width="1.2"/>`;
    const area = `M${X(data[0].date).toFixed(1)},${H-padB} `+data.map(p=>`L${X(p.date).toFixed(1)},${Y(toDisp(p.ma)).toFixed(1)}`).join(' ')+` L${X(lastDate).toFixed(1)},${H-padB} Z`;
    s += `<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wt)" stop-opacity=".22"/><stop offset="1" stop-color="var(--wt)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#wg)"/>`;
    s += `<polyline id="maLine" points="${data.map(p=>X(p.date).toFixed(1)+','+Y(toDisp(p.ma)).toFixed(1)).join(' ')}" fill="none" stroke="var(--wt)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const dotR = data.length>60?1.8:3;
  data.forEach(p=>{ s += `<circle class="wdot" cx="${X(p.date).toFixed(1)}" cy="${Y(toDisp(p.kg)).toFixed(1)}" r="${dotR}" fill="var(--card)" stroke="var(--muted)" stroke-width="1.4"/>`; });
  s += `<g id="wTip" style="display:none;pointer-events:none"><line id="wTipLine" y1="${padT}" y2="${H-padB}" stroke="var(--wt)" stroke-dasharray="3 3"/><circle id="wTipDot" r="5" fill="var(--wt)" stroke="var(--card)" stroke-width="2"/>
    <rect id="wTipBox" rx="8" height="36" width="136" fill="var(--text)"/><text id="wTipT1" style="fill:var(--card);font-weight:700;font-size:12px"></text><text id="wTipT2" style="fill:var(--card);opacity:.75;font-size:10.5px"></text></g>`;
  s += `<rect x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg');
  const show = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width);
    let best = data[0], bd = Infinity; data.forEach(p=>{ const d = Math.abs(X(p.date)-px); if(d<bd){ bd=d; best=p; } });
    const cx = X(best.date), cy = Y(toDisp(best.kg));
    $('#wTip',svg).style.display='';
    $('#wTipLine',svg).setAttribute('x1',cx); $('#wTipLine',svg).setAttribute('x2',cx);
    $('#wTipDot',svg).setAttribute('cx',cx); $('#wTipDot',svg).setAttribute('cy',cy);
    const bx = Math.min(Math.max(cx-68,padL), W-padR-136), by = cy < padT+50 ? H-padB-44 : padT;
    $('#wTipBox',svg).setAttribute('x',bx); $('#wTipBox',svg).setAttribute('y',by);
    const t1 = $('#wTipT1',svg), t2 = $('#wTipT2',svg);
    t1.setAttribute('x',bx+9); t1.setAttribute('y',by+15); t1.textContent = `${fmtW(best.kg)} ${unit()} · avg ${fmtW(best.ma)}`;
    t2.setAttribute('x',bx+9); t2.setAttribute('y',by+29); t2.textContent = fmtDate(best.date,{weekday:'short',month:'short',day:'numeric'});
  };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', ()=>{ $('#wTip',svg).style.display='none'; });
}

const aimLabel = v => ({'-500': unit()==='lb' ? 'Lose ~1 lb a week' : 'Lose ~0.45 kg a week', '-250': unit()==='lb' ? 'Lose ~½ lb a week' : 'Lose ~0.25 kg a week', '0':'Maintain weight', '250':'Gain slowly'})[String(v)];
/* the remembered goal, else lose/gain/maintain depending on goal weight vs. the latest weigh-in */
function helperAim(){
  const pr = S.settings.profile; if(pr.aim!==null) return pr.aim;
  const gw = S.settings.goalWeight, last = S.weights[S.weights.length-1];
  if(gw && last && Math.abs(gw-last.kg) > 0.5) return gw < last.kg ? -250 : 250;
  return 0;
}
function helperInputs(){
  const v = id => { const el = $('#'+id); return el ? el.value.trim() : ''; }, n = id => num(v(id));
  const heightCm = unit()==='lb' ? ((n('hFt')||0)*12 + (n('hIn')||0))*2.54 : n('hCm');
  return {sex:v('hSex'), age:n('hAge'), heightCm: heightCm>0 ? heightCm : null, w:n('hW'), t:n('hT'), activity:n('hA'), aim:n('hG'), perLb:n('hP')};
}
/* Mifflin-St Jeor BMR × activity factor = TDEE; + goal adjustment; floor = max(BMR, 1,200 women / 1,500 men);
   protein = g/lb × goal weight (current weight if no goal); fat 30% of calories; carbs = the rest */
function helperCalc(){
  const x = helperInputs(), u = unit(), lim = u==='lb' ? [50,800] : [20,360], missing = [];
  if(!x.sex) missing.push('sex'); if(!(x.age>=13 && x.age<=110)) missing.push('age');
  if(!(x.heightCm>=90 && x.heightCm<=250)) missing.push('height'); if(!(x.w>=lim[0] && x.w<=lim[1])) missing.push('current weight');
  if(missing.length) return {missing};
  const kg = toKg(x.w), male = x.sex==='m';
  const bmr = 10*kg + 6.25*x.heightCm - 5*x.age + (male ? 5 : -161);
  const tdee = bmr * x.activity, raw = tdee + x.aim, minCal = male ? 1500 : 1200, floor = Math.max(bmr, minCal);
  const floored = raw < floor, cal = floored ? Math.ceil(floor/10)*10 : Math.round(raw/10)*10;
  const hasT = x.t>=lim[0] && x.t<=lim[1], baseDisp = hasT ? x.t : x.w, baseLb = u==='lb' ? baseDisp : baseDisp*LB_PER_KG;
  const protein = Math.round(baseLb * x.perLb / 5) * 5, fat = Math.round(cal*0.30/9), carbs = Math.max(0, Math.round((cal - protein*4 - fat*9)/4));
  return {kg, bmr, tdee, raw, floor, floored, minCal, bmrFloor: bmr >= minCal, cal, protein, fat, carbs, baseDisp, hasT, male, ...x};
}
function updateHelper(){
  const o = $('#hOut'), m = $('#hMath'); if(!o) return; const r = helperCalc(), u = unit();
  if(r.missing){ o.innerHTML = `Enter your ${r.missing.join(', ').replace(/, ([^,]*)$/, ' and $1')} to get a suggestion.`; m.innerHTML = ''; return; }
  const act = ACTIVITY.find(a=>a[0]===r.activity) || ACTIVITY[0], adj = r.aim===0 ? '' : ` ${r.aim<0?'−':'+'} ${fmtN(Math.abs(r.aim))} (${aimLabel(r.aim).toLowerCase()})`;
  o.innerHTML = `Suggested: <b style="color:var(--cal)" data-h="cal">${fmtN(r.cal)}</b> kcal · <b style="color:var(--pro)" data-h="protein">${r.protein}</b> g protein<br><span class="small"><b data-h="fat">${r.fat}</b> g fat · <b data-h="carbs">${r.carbs}</b> g carbs</span>`;
  m.innerHTML = `<div><span>BMR</span><b data-h="bmr">${fmtN(r.bmr)}</b> kcal <span class="muted">Mifflin-St Jeor: 10 × ${r1(r.kg)} kg + 6.25 × ${r0(r.heightCm)} cm − 5 × ${r.age} ${r.male?'+ 5':'− 161'}</span></div>
    <div><span>TDEE</span><b data-h="tdee">${fmtN(r.tdee)}</b> kcal <span class="muted">${fmtN(r.bmr)} × ${r.activity} (${act[1].toLowerCase()})</span></div>
    <div><span>Target</span><b>${fmtN(r.cal)}</b> kcal <span class="muted">${fmtN(r.tdee)}${adj} = ${fmtN(r.raw)}${r.floored ? ` → raised to ${fmtN(r.cal)}: never below ${r.bmrFloor ? `your BMR (${fmtN(r.bmr)})` : `${fmtN(r.minCal)} kcal (${r.male?'men':'women'})`}` : ''}</span></div>
    <div><span>Macros</span><span class="muted">protein ${u==='lb' ? r.perLb : r1(r.perLb*LB_PER_KG)} g × ${r1(r.baseDisp)} ${u} ${r.hasT?'goal':'current'} weight = ${r.protein} g · fat 30% of calories = ${r.fat} g · carbs = the rest (${r.carbs} g)</span></div>`;
}

}

    const data = JSON.parse(await file.text());

    next = normalize(data);

  const ok = await confirmDialog({title:'Replace current data?', text:`Import ${Object.keys(next.entries).length} days of food logs, ${next.foods.length} saved foods, ${next.weights.length} weigh-ins and ${Object.values(next.exercise).reduce((s,l)=>s+l.length,0)} exercise entries. This replaces everything currently stored on this device${CFG && loadMeta().uid ? ' and in your account on all your devices' : ''}.`, ok:'Import'});

/* ---------- cloud account & sync (Supabase) ----------

     change time; deleted ones become tombstones.

   * Triggers: app open, returning to the app, coming back online, ~2 s after an edit, and every 90 s while visible.

var SYNC_ON = false;
const CFG = (()=>{

  try { const p = key.split('.'); if(p.length===3){ const j = JSON.parse(atob(p[1].replace(/-/g,'+').replace(/_/g,'/'))); if(j.role && j.role!=='anon') return null; } } catch(e){}

const SKEY = 'fuel.sync.v1', PROMPT_KEY = 'fuel.syncPrompt.dismissed';
const TABLE = {p:'profiles', e:'food_entries', f:'saved_foods', w:'weight_entries', x:'exercise_entries'};
const KINDS = ['p','e','f','w','x'];
const NULLS = {
  e:{day:null, meal:null, name:null, servings:null, calories:null, protein:null, carbs:null, fat:null, fiber:null, serving:null, logged_at:null},
  f:{name:null, servings:null, calories:null, protein:null, carbs:null, fat:null, fiber:null, serving:null},
  w:{day:null, kg:null},
  x:{day:null, name:null, code:null, met:null, minutes:null, calories:null, logged_at:null}

const ACC = {client:null, ready:false, expired:false, state:'idle', err:'', libErr:false};
const blankMeta = () => ({v:1, uid:null, user:null, recs:{p:{},e:{},f:{},w:{},x:{}}, dirty:{p:{},e:{},f:{},w:{},x:{}}, cur:{}, last:0, rejected:0});
function loadMeta(){ try { const m = JSON.parse(localStorage.getItem(SKEY)); if(m && m.v===1 && m.recs && m.dirty){ KINDS.forEach(k=>{ m.recs[k]=m.recs[k]||{}; m.dirty[k]=m.dirty[k]||{}; }); m.cur=m.cur||{}; return m; } } catch(e){} return blankMeta(); }

const fp = o => hex32(cyrb128(JSON.stringify(o)).slice(0,2));   // 64-bit fingerprint of a record's synced fields

/* local record -> server columns (clamped to the server's CHECK limits so one odd value can't block a batch) */
const cl = (v, max) => { v = +v; return isFinite(v) && v>=0 ? Math.min(v, max) : 0; };
const goal = (v, max) => { v = +v; return isFinite(v) && v>0 ? Math.min(v, max) : null; };

const isoMs = ms => { ms = +ms; return isFinite(ms) && Math.abs(ms) < 8e15 ? new Date(ms).toISOString() : null; };
const rowE = (k, e) => validDay(k) ? {day:k, meal:fixMeal(e.meal, e.ts), name:String(e.name||'Food').slice(0,200), servings:cl(e.servings,99999), calories:cl(e.cal,999999),
  protein:cl(e.p,99999), carbs:cl(e.c,99999), fat:cl(e.f,99999), fiber:cl(e.fib,99999), serving:e.serv?String(e.serv).slice(0,120):null, logged_at:isoMs(e.ts)} : null;
const rowF = f => ({name:String(f.name||'Food').slice(0,200), servings:cl(f.servings,99999), calories:cl(f.cal,999999), protein:cl(f.p,99999), carbs:cl(f.c,99999), fat:cl(f.f,99999), fiber:cl(f.fib,99999), serving:f.serv?String(f.serv).slice(0,120):null});
const rowX = (k, x) => validDay(k) ? {day:k, name:String(x.name||'Exercise').slice(0,200), code:x.code||null, met:x.code && x.met>0 && x.met<30 ? +x.met : null,
  minutes:x.min>0 && x.min<=1440 ? +x.min : null, calories:Math.min(cl(x.kcal,19999), 19999), logged_at:isoMs(x.ts)} : null;
const rowW = w => validDay(w.date) && +w.kg>0 ? {day:w.date, kg:Math.min(+w.kg, 999)} : null;
function rowP(){ const st = S.settings, g = st.goals;
  return {unit:st.unit==='kg'?'kg':'lb', goal_calories:goal(g.calories,99999), goal_protein:goal(g.protein,9999), goal_carbs:goal(g.carbs,9999), goal_fat:goal(g.fat,9999), goal_fiber:goal(g.fiber,9999),
    goals_set:!!st.goalsSet, eat_back:st.eatBack!==false, usda_key:(st.usdaKey||'').slice(0,100)||null, helper:normProfile(st.profile),
    goal_weight_kg:st.goalWeight>0 && st.goalWeight<1000 ? st.goalWeight : null, goal_weight_start_kg:st.goalWeight && st.goalWeightStart>0 && st.goalWeightStart<1000 ? st.goalWeightStart : null}; }

/* server row -> local record */
function entryFromRow(r){ const ts = Date.parse(r.logged_at)||Date.parse(r.updated_at)||Date.now();
  const e = {id:r.id, name:String(r.name||'Food').slice(0,120), meal:fixMeal(r.meal, ts), servings:nz(r.servings)||1, cal:nz(r.calories), p:nz(r.protein), c:nz(r.carbs), f:nz(r.fat), fib:nz(r.fiber),
  ts}; if(r.serving) e.serv = String(r.serving).slice(0,80); return e; }
function foodFromRow(r){ const f = {id:r.id, name:String(r.name||'Food').slice(0,120), cal:nz(r.calories), p:nz(r.protein), c:nz(r.carbs), f:nz(r.fat), fib:nz(r.fiber), servings:nz(r.servings)||1}; if(r.serving) f.serv = String(r.serving).slice(0,80); return f; }
function profileFromRow(r){ const st = S.settings, d = defaults().settings.goals;
  st.unit = r.unit==='kg'?'kg':'lb'; st.goalsSet = !!r.goals_set; st.usdaKey = typeof r.usda_key==='string' ? r.usda_key.slice(0,100) : '';

  st.goalWeight = nz(r.goal_weight_kg)||null; st.goalWeightStart = st.goalWeight ? (nz(r.goal_weight_start_kg)||null) : null;
  if(r.helper && typeof r.helper==='object') st.profile = normProfile(r.helper);
  if(typeof r.eat_back==='boolean') st.eatBack = r.eat_back; }
const exFromRow = r => normExercise({name:r.name, code:r.code, met:r.met, min:r.minutes, kcal:r.calories, ts:Date.parse(r.logged_at)||Date.parse(r.updated_at)||Date.now()}, r.id);

function snapshot(){
  const o = {p:{me:fp(rowP())}, e:{}, f:{}, w:{}, x:{}};
  for(const k of Object.keys(S.exercise)) for(const x of S.exercise[k]) o.x[x.id] = fp(rowX(k,x));
  for(const k of Object.keys(S.entries)) for(const e of S.entries[k]) o.e[e.id] = fp(rowE(k,e));
  for(const f of S.foods) o.f[f.id] = fp(rowF(f));
  for(const w of S.weights) o.w[weightId(w.date)] = fp(rowW(w));

}
/* Change tracker, called by save(). While the device belongs to an account (meta.uid), changes are queued for upload. */
function trackChanges(){
  if(!SYNC_ON) return 0;
  const m = loadMeta(), snap = snapshot(), now = Date.now(), owned = !!m.uid; let n = 0;
  for(const k of KINDS){ const R = m.recs[k], cur = snap[k];
    for(const id in cur){ const r = R[id]; if(!r || r[0]!==cur[id]){ R[id] = [cur[id], now]; if(owned){ m.dirty[k][id] = 1; n++; } } }
    for(const id in R){ if(!(id in cur) && R[id][0]!==null){ if(owned){ R[id] = [null, now]; m.dirty[k][id] = 1; n++; } else delete R[id]; } }
  }
  saveMeta(m);
  if(n && ACC.client){ scheduleSync(2000); paintAccount(); }
  return n;
}
function writeLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* apply rows pulled from the server; a local change that is newer and not yet uploaded wins */
function applyRemote(k, rows){
  const m = loadMeta(); let changed = false;
  const where = new Map(), BOX = k==='x' ? S.exercise : S.entries; if(k==='e' || k==='x') for(const d in BOX) for(const e of BOX[d]) where.set(e.id, d);
  for(const r of rows){
    const id = k==='p' ? 'me' : r.id, rt = Date.parse(r.updated_at)||0, R = m.recs[k][id];
    if(m.dirty[k][id] && R && R[1] > rt) continue;
    if(k==='p'){ const before = JSON.stringify(S.settings); profileFromRow(r); if(JSON.stringify(S.settings)!==before) changed = true;
      const mine = rowP(), plainHelper = fp(mine.helper)===fp(normProfile());   // server row without a helper yet (older app): upload this device's
      m.recs.p.me = [fp(r.helper && typeof r.helper==='object' || plainHelper ? mine : {...mine, helper:null}), rt]; delete m.dirty.p.me; continue; }
    if(r.deleted){
      if(k==='e' || k==='x'){ const d = where.get(id); if(d){ BOX[d] = BOX[d].filter(e=>e.id!==id); if(!BOX[d].length) delete BOX[d]; where.delete(id); changed = true; } }
      else if(k==='f'){ const i = S.foods.findIndex(f=>f.id===id); if(i>=0){ S.foods.splice(i,1); changed = true; } }
      else { const i = S.weights.findIndex(w=>weightId(w.date)===id); if(i>=0){ S.weights.splice(i,1); changed = true; } }
      delete m.recs[k][id]; delete m.dirty[k][id]; continue;
    }
    let h;
    if(k==='e'){ const e = entryFromRow(r), d = where.get(id);
      if(d && d!==r.day){ S.entries[d] = S.entries[d].filter(x=>x.id!==id); if(!S.entries[d].length) delete S.entries[d]; }
      const list = S.entries[r.day] = S.entries[r.day]||[]; const i = list.findIndex(x=>x.id===id);
      if(i>=0){ if(JSON.stringify(list[i])!==JSON.stringify(e)){ list[i] = e; changed = true; } } else { list.push(e); changed = true; }
      where.set(id, r.day); h = fp(rowE(r.day, e));
      if(!MEAL_LABEL[r.meal]) h = fp({...rowE(r.day, e), meal:r.meal});   // old snack row: remember the server's version so the re-mapped meal is uploaded
    } else if(k==='x'){ const x = exFromRow(r), d = where.get(id);
      if(d && d!==r.day){ BOX[d] = BOX[d].filter(y=>y.id!==id); if(!BOX[d].length) delete BOX[d]; }
      const list = BOX[r.day] = BOX[r.day]||[]; const i = list.findIndex(y=>y.id===id);
      if(i>=0){ if(JSON.stringify(list[i])!==JSON.stringify(x)){ list[i] = x; changed = true; } } else { list.push(x); changed = true; }
      where.set(id, r.day); h = fp(rowX(r.day, x));
    } else if(k==='f'){ const f = foodFromRow(r), i = S.foods.findIndex(x=>x.id===id);
      if(i>=0){ if(JSON.stringify(S.foods[i])!==JSON.stringify(f)){ S.foods[i] = f; changed = true; } } else { S.foods.push(f); changed = true; }
      h = fp(rowF(f));
    } else { const w = {date:r.day, kg:nz(r.kg)}, i = S.weights.findIndex(x=>x.date===r.day);
      if(i>=0){ if(S.weights[i].kg!==w.kg){ S.weights[i] = w; changed = true; } } else { S.weights.push(w); S.weights.sort((a,b)=>a.date<b.date?-1:1); changed = true; }
      h = fp(rowW(w));
    }
    m.recs[k][id] = [h, rt]; delete m.dirty[k][id];

  return changed;
}

let syncTimer = null, syncing = null, syncAgain = false, pendingRender = false;
function scheduleSync(ms){ if(!ACC.client) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>{ syncNow(); }, ms); }
function syncNow(){
  if(!ACC.client || !loadMeta().uid) return Promise.resolve();
  if(syncing){ syncAgain = true; return syncing; }
  const locked = fn => (navigator.locks && navigator.locks.request) ? navigator.locks.request('fuel-sync', fn) : fn();  // one sync at a time across tabs
  syncing = (async()=>{ do { syncAgain = false; await locked(syncOnce); } while(syncAgain); })().finally(()=>{ syncing = null; });
  return syncing;
}
const netErr = e => !navigator.onLine || /failed to fetch|networkerror|network request failed|load failed|fetch failed|timeout|aborted/i.test((e && (e.message||e.details))||'') || (e && e.status===0);
function setSync(state, err){ ACC.state = state; ACC.err = err||''; paintAccount(); }
async function syncOnce(){
  if(!navigator.onLine){ setSync('offline'); return; }
  const {data, error} = await ACC.client.auth.getSession();
  const session = data && data.session;
  if(!session){ if(error && netErr(error)) setSync('offline'); else { ACC.expired = true; setSync('idle'); } return; }
  const meta0 = loadMeta();
  if(!meta0.uid || meta0.uid!==session.user.id){ setSync('idle'); return; }
  setSync('syncing');
  try {
    S = load(); trackChanges();              // pick up edits made in other tabs before merging
    let changed = false;
    for(const k of KINDS) if(await pull(k, session.user.id)) changed = true;
    trackChanges();                            // queue system migrations of pulled rows (old snack entries → a meal)
    await push(session.user.id);
    const m = loadMeta(); m.last = Date.now(); saveMeta(m);
    setSync('ok');
    if(changed) onRemoteChange();
  } catch(e){ setSync(netErr(e) ? 'offline' : 'error', (e && e.message) || String(e)); }
}
async function pull(k, userId){
  let m = loadMeta();
  const since = m.cur[k] ? new Date(Date.parse(m.cur[k]) - 60000).toISOString() : null;  // 60 s overlap: never miss a row committed late
  let from = 0, last = null, changed = false;
  for(;;){
    let q = ACC.client.from(TABLE[k]).select('*').eq('user_id', userId);
    if(since) q = q.gte('synced_at', since);
    q = q.order('synced_at', {ascending:true}); if(k!=='p') q = q.order('id', {ascending:true});
    const {data, error} = await q.range(from, from+999); if(error) throw error;
    if(data.length){ if(applyRemote(k, data)) changed = true; last = data[data.length-1].synced_at; }
    if(data.length < 1000) break; from += 1000;
  }
  if(last){ m = loadMeta(); if(!m.cur[k] || Date.parse(last) >= Date.parse(m.cur[k])) m.cur[k] = last; saveMeta(m); }
  return changed;
}
async function push(userId){
  let m = loadMeta();
  const E = new Map(); for(const d in S.entries) for(const e of S.entries[d]) E.set(e.id, [d,e]);
  const X = new Map(); for(const d in S.exercise) for(const x of S.exercise[d]) X.set(x.id, [d,x]);
  const F = new Map(S.foods.map(f=>[f.id,f])), W = new Map(S.weights.map(w=>[weightId(w.date), w]));
  for(const k of KINDS){
    const ids = Object.keys(m.dirty[k]); if(!ids.length) continue;
    const rows = [], sent = [];
    for(const id of ids){
      const R = m.recs[k][id]; let data = null;
      if(R){ if(k==='p') data = rowP(); else if(R[0]===null) data = {deleted:true, ...NULLS[k]};
        else { const x = k==='e' ? E.get(id) : k==='x' ? X.get(id) : k==='f' ? F.get(id) : W.get(id); const r = x && (k==='e' ? rowE(x[0], x[1]) : k==='x' ? rowX(x[0], x[1]) : k==='f' ? rowF(x) : rowW(x)); if(r) data = {deleted:false, ...r}; } }
      if(!data){ delete m.dirty[k][id]; continue; }                       // nothing sendable (stale marker or invalid date)
      const row = {user_id:userId, updated_at:new Date(R[1]).toISOString(), ...data}; if(k!=='p') row.id = id;
      rows.push(row); sent.push([id, R[1], R[0]===null]);
    }
    saveMeta(m);
    const rejected = await upsertRows(k, rows);
    m = loadMeta();
    for(const [id, t, del] of sent){ const R = m.recs[k][id]; if(R && R[1]===t){ delete m.dirty[k][id]; if(del) delete m.recs[k][id]; } }
    m.rejected = (m.rejected||0) + rejected;
    saveMeta(m);
  }
}
async function upsertRows(k, rows){
  const onConflict = k==='p' ? 'user_id' : 'user_id,id', dataErr = e => /^(22|23)/.test((e && e.code)||''); let rejected = 0;

    const chunk = rows.slice(i, i+500);
    const {error} = await ACC.client.from(TABLE[k]).upsert(chunk, {onConflict});
    if(!error) continue;
    if(!dataErr(error)) throw error;
    for(const r of chunk){ const x = await ACC.client.from(TABLE[k]).upsert(r, {onConflict}); if(x.error){ if(dataErr(x.error)) rejected++; else throw x.error; } } // skip only the row the server refuses
  }

}
const typing = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };
function onRemoteChange(){
  if(typing()){ pendingRender = true; return; }
  render();

}
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(pendingRender && !typing()){ pendingRender = false; render(); } }, 0));

/* ---- account lifecycle ---- */
function loadScript(src){ return new Promise((res, rej)=>{ if(window.supabase && window.supabase.createClient) return res(); const el = document.createElement('script'); el.src = src; el.async = true; el.onload = ()=>res(); el.onerror = ()=>rej(new Error('Could not load '+src)); document.head.appendChild(el); }); }
async function initAccount(){
  if(!CFG) return;
  SYNC_ON = true; trackChanges();       // baseline fingerprints for data created before sync existed
  try { await loadScript('vendor/supabase/supabase.js'); }
  catch(e){ ACC.libErr = true; ACC.ready = true; paintAccount(); return; }
  ACC.client = window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:'fuel.auth'}});

}
async function onAuthEvent(event, session){

    ACC.ready = true;
    if(session){ ACC.expired = false; if(m.uid!==session.user.id) await adoptUser(session.user); else { if(m.user!==userName(session.user)){ m.user = userName(session.user); saveMeta(m); } syncNow(); } }

}
/* First sign-in on this device: everything already here is merged into the account (union by record id). */
async function adoptUser(user){
